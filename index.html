<style>

s-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;overflow-x:auto;background:#191a1f;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.tabs button{flex:1 0 58px;background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;padding:4px 2px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:17px;margin-bottom:3px}.pills{display:flex;gap:7px;overflow:auto;margin:15px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:800}.pill.sel{background:var(--lime);color:#15190e}.exercise,.entry,.habit,.badge{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child,.badge:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px}.tag{display:inline-block;background:#303522;color:var(--lime);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900}.check{width:20px;height:20px;accent-color:var(--lime)}.grid,.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.macro{background:#141519;padding:13px;border-radius:12px}.stat strong,.macro strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}.track{height:8px;background:#3a3b40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}.shortcut{background:#15161a;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.locked{opacity:.5}h2{font-size:19px;margin:2px 0 8px}p{line-height:1.5}ul{padding-left:22px;color:var(--muted);line-height:1.7}.note.warn{color:#ffd27a}

<body>
<header><div class="brand">FORGED<span>FITNESS</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app"><section class="card"><strong>Loading ForgedFitness…</strong><p class="muted">If this stays here, the app script did not start. Please report this message.</p></section></main>
<nav id="tabs" class="tabs" aria-label="Main navigation"></nav>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var nav=document.getElementById('tabs');
var KEY='forgedfitness-stable-v3';
var defaults={page:'Today',plan:0,weight:'130',height:'196',age:'',equation:'range',activity:'1.375',pace:'0.25',foods:[],weights:[],sessions:[],checks:{},done:{},shortcuts:[],calorieGoal:'',proteinGoal:'',macroResult:null};
var state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=Object.assign({},defaults)}
state.foods=Array.isArray(state.foods)?state.foods:[];state.weights=Array.isArray(state.weights)?state.weights:[];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.shortcuts=Array.isArray(state.shortcuts)?state.shortcuts:[];state.checks=state.checks||{};state.done=state.done||{};
var plans=[{name:'Upper A',focus:'CHEST · BACK · SHOULDERS',moves:[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]},{name:'Lower A',focus:'QUADS · HAMSTRINGS · CORE',moves:[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]},{name:'Upper B',focus:'BACK · CHEST · ARMS',moves:[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]},{name:'Lower B',focus:'GLUTES · HAMSTRINGS · CORE',moves:[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]}];
var habits=['Get some planned movement','Eat a protein-rich food','Have fruit or vegetables','Make time for good sleep'];
var quotes=['Show up. Put in the work. Get a little stronger.','You do not need a perfect day. Just make the next good choice.','Strength is built one rep at a time.','The scale is one stat. Your effort is the real score.','Rest is training too. Recover, then come back ready.','Small wins stack up. Keep building.'];
var meals=[{id:'oats',name:'Protein oats & banana',cal:420,pro:26},{id:'yoghurt',name:'Greek yoghurt & berries',cal:250,pro:20},{id:'eggs',name:'Eggs on wholemeal toast',cal:380,pro:24},{id:'tuna',name:'Tuna jacket potato',cal:460,pro:34}];
var recipes=[{id:'chicken',name:'Chicken, rice & veg bowl',time:'25 min',cal:560,pro:43,items:['150 g chicken breast','75 g dry rice','Frozen vegetables','Seasoning'],steps:'Cook rice. Cook chicken thoroughly, heat vegetables, and serve together.'},{id:'chilli',name:'Easy bean chilli',time:'25 min',cal:430,pro:22,items:['1 can mixed beans','1 can chopped tomatoes','Chilli powder or paprika','Rice or potato'],steps:'Add beans, tomatoes and seasoning to a pan. Simmer for 15–20 minutes.'},{id:'potato',name:'Tuna jacket potato',time:'15 min',cal:490,pro:36,items:['1 potato','1 small can tuna','Plain yoghurt or light mayo','Sweetcorn or salad'],steps:'Cook potato until soft. Mix tuna with yoghurt or mayo, split potato and add toppings.'},{id:'tofu',name:'Tofu & veg noodles',time:'20 min',cal:520,pro:25,items:['150 g tofu','Noodles','Mixed vegetables','Soy sauce'],steps:'Cook noodles. Brown tofu, add vegetables and cook until hot. Toss together.'}];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function card(s,extra){return '<section class="card '+(extra||'')+'">'+s+'</section>'}
function button(text,action,extra){return '<button class="btn '+(extra||'')+'" data-action="'+action+'">'+text+'</button>'}
function todaysFoods(){return state.foods.filter(function(f){return f.date===today()})}
function activeStreak(){var dates={};state.sessions.forEach(function(s){dates[s.date]=true});Object.keys(state.checks).forEach(function(day){var c=state.checks[day]||{};if(Object.keys(c).some(function(k){return c[k]}))dates[day]=true});var d=new Date();if(!dates[today()])d.setDate(d.getDate()-1);var n=0;while(dates[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]){n++;d.setDate(d.getDate()-1)}return n}
function weekly(){var start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-6);return state.sessions.filter(function(s){return new Date(s.date+'T12:00:00')>=start}).length}
function drawNav(){var pages=[['Today','⌂'],['Train','✣'],['Food','＋'],['Recipes','♨'],['Macros','◎'],['Progress','↗'],['Rewards','★']];nav.innerHTML=pages.map(function(p){return '<button class="'+(state.page===p[0]?'active':'')+'" data-page="'+p[0]+'"><span>'+p[1]+'</span>'+p[0]+'</button>'}).join('')}
function macros(){var html='<div class="eyebrow">FREE ON-DEVICE ESTIMATOR</div><div class="hero">YOUR MACROS.<br>YOUR START.</div><p class="sub">A rough estimate based on details you enter. This is not AI and sends no personal details anywhere.</p>';
html+=card('<h2>About you</h2><p class="note">For adults 18+ only. “Show a range” avoids choosing a sex-specific equation.</p><div class="row"><label>Age<input id="age" type="number" min="18" max="100" value="'+esc(state.age)+'" placeholder="Years"></label><label>Weight<input id="mw" type="number" min="35" max="350" step="0.1" value="'+esc(state.weight)+'" placeholder="kg"></label></div><div class="row"><label>Height<input id="mh" type="number" min="120" max="230" value="'+esc(state.height)+'" placeholder="cm"></label><label>Activity<select id="activity"><option value="1.2">Mostly sitting</option><option value="1.375">Light activity</option><option value="1.55">Moderate activity</option><option value="1.725">Very active</option></select></label></div><label>Equation<select id="equation"><option value="range">Show a range</option><option value="male">Male equation</option><option value="female">Female equation</option></select></label><label>Goal<select id="pace"><option value="0">Maintenance estimate</option><option value="0.25">Gentle weight-loss estimate</option><option value="0.5">Moderate weight-loss estimate</option></select></label>'+button('GENERATE ESTIMATE','generate','orange')+'</section>');
if(state.macroResult){var r=state.macroResult;html+=card('<h2>Estimated daily macros</h2><span class="tag">ROUGH ESTIMATE · NOT A PRESCRIPTION</span><div class="macro-grid"><div class="macro"><span class="label">CALORIES</span><strong>'+r.kcal.toLocaleString()+'</strong>kcal/day</div><div class="macro"><span class="label">PROTEIN</span><strong>'+r.pro+' g</strong>per day</div><div class="macro"><span class="label">CARBS</span><strong>'+r.carb+' g</strong>per day</div><div class="macro"><span class="label">FAT</span><strong>'+r.fat+' g</strong>per day</div></div><p class="note">Estimated maintenance: about '+r.maint.toLocaleString()+' kcal/day. These are broad estimates, not clinical targets.</p>'+(r.warn?'<p class="note warn">This calorie estimate is unusually low relative to estimated resting needs. Ask a GP or dietitian before using it.</p>':'')+button('USE CALORIE AND PROTEIN GOALS','apply','alt'))}
html+='<p class="note">Not for under-18s, pregnancy/breastfeeding, eating-disorder history, or medically managed nutrition. Ask a GP or registered dietitian for tailored advice. Estimates can be inaccurate.</p>';return html}
function render(){var foods=todaysFoods(),cal=foods.reduce(function(n,f){return n+(Number(f.cal)||0)},0),pro=foods.reduce(function(n,f){return n+(Number(f.pro)||0)},0),html='';
if(state.page==='Today'){var checks=state.checks[today()]||{};html='<div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+'</div><div class="hero">BUILD<br>YOURSELF.</div><p class="sub">Lose fat. Build strength. Keep showing up.</p>'+card('<div class="eyebrow">TODAY’S MISSION</div><div class="hero">One day stronger.</div><p class="muted">A little progress beats no progress.</p>'+button('START A WORKOUT','train','orange'),'hero-card')+card('<div class="between"><div><div class="label">WORKOUTS · LAST 7 DAYS</div><div class="big">'+weekly()+' sessions</div></div><span class="tag">🔥 '+activeStreak()+' DAY STREAK</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,weekly()/4*100)+'%"></div></div><p class="note">A manageable starting goal is 2–4 strength sessions each week.</p>')+card('<div class="between"><div><div class="label">TODAY’S FOOD</div><div class="metric">'+cal+' kcal</div></div><div><div class="label">PROTEIN</div><div class="metric">'+pro+' g</div></div></div>'+button('LOG FOOD','food','alt'))+card('<div class="label">DAILY DISCIPLINE</div>'+habits.map(function(h,i){return '<label class="habit"><span>'+h+'</span><input class="check" type="checkbox" data-habit="'+i+'" '+(checks[i]?'checked':'')+'></label>'}).join(''))+'<p class="note">Your profile starts at 6 ft 5 in and about 20–21 stone, as you shared. Change weight in Progress; optional macro estimates are in Macros.</p>'}
else if(state.page==='Train'){var i=Math.max(0,Math.min(plans.length-1,Number(state.plan)||0)),p=plans[i],prefix=today()+'-'+i;html='<div class="eyebrow">THE WORK</div><div class="hero">NO EXCUSES.<br>JUST REPS.</div><p class="sub">Four-day upper/lower plan. Use comfortable loads and good form.</p><div class="pills">'+plans.map(function(x,n){return '<button class="pill '+(n===i?'sel':'')+'" data-plan="'+n+'">'+x.name+'</button>'}).join('')+'</div>'+card('<span class="tag">'+p.focus+'</span><h2>'+p.name+'</h2>'+p.moves.map(function(m,n){var k=prefix+'-'+n;return '<div class="exercise"><div><strong class="'+(state.done[k]?'done':'')+'">'+m[0]+'</strong><small>'+m[1]+'</small></div><button class="btn alt" data-exercise="'+n+'" data-prefix="'+prefix+'">'+(state.done[k]?'DONE ✓':'CHECK')+'</button></div>'}).join('')+button('FINISH WORKOUT','finish'))+'<p class="note">Stop if you feel sharp or worsening pain. Ask a qualified trainer if unsure about technique.</p>'}
else if(state.page==='Food'){var quick=meals.concat(state.shortcuts);html='<div class="eyebrow">FUEL THE WORK</div><div class="hero">EAT WELL.<br>GET STRONG.</div>'+card('<h2>Meal shortcuts</h2><p class="note">Tap to log an approximate serving.</p>'+quick.map(function(m){return '<div class="shortcut"><div class="between"><span><strong>'+esc(m.name)+'</strong><small>'+m.cal+' kcal · '+m.pro+' g protein</small></span><button class="btn small-btn" data-shortcut="'+esc(m.id)+'">ADD</button></div></div>'}).join(''))+card('<h2>Your targets</h2><p class="note">Optional. Use the Macros tab for an estimate.</p><div class="row"><div class="macro"><span class="label">CALORIES</span><strong>'+esc(state.calorieGoal||'Not set')+'</strong></div><div class="macro"><span class="label">PROTEIN</span><strong>'+esc(state.proteinGoal?state.proteinGoal+' g':'Not set')+'</strong></div></div><button class="btn alt" data-page="Macros">OPEN MACROS</button>')+card('<h2>Log a meal</h2><input id="foodName" placeholder="Meal name"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>'+button('ADD TO TODAY','add-food'))+card('<h2>Today’s log</h2>'+(foods.length?foods.map(function(f){return '<div class="entry"><span>'+esc(f.name)+'<small>'+f.cal+' kcal · '+f.pro+' g protein</small></span><div><button class="btn alt small-btn" data-save="'+esc(f.id)+'">SAVE</button> <button class="btn small-btn" data-remove="'+esc(f.id)+'">×</button></div></div>'}).join(''):'<div class="empty">Nothing logged yet.</div>')+'<div class="divider"></div><strong>TOTAL: '+cal+' kcal · '+pro+' g protein</strong>')}
else if(state.page==='Recipes'){html='<div class="eyebrow">SIMPLE FOOD IDEAS</div><div class="hero">RECIPES THAT<br>FUEL YOU.</div><p class="sub">Easy meal ideas with estimated nutrition per serving.</p>'+recipes.map(function(r){return card('<div class="between"><h2>'+r.name+'</h2><span class="tag">'+r.time+'</span></div><p class="muted">About '+r.cal+' kcal · '+r.pro+' g protein</p><strong>Ingredients</strong><ul>'+r.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p class="muted">'+r.steps+'</p>'+button('ADD TO FOOD LOG','recipe-'+r.id,'alt')}).join('')}
else if(state.page==='Macros'){html=macros()}
else if(state.page==='Progress'){html='<div class="eyebrow">PROOF OF YOUR WORK</div><div class="hero">TRACK THE<br>COMEBACK.</div>'+card('<h2>Weight check-in</h2><p class="muted">Enter weight in kilograms.</p><div class="row"><input id="weightInput" type="number" min="1" max="500" step="0.1" value="'+esc(state.weight)+'"><button class="btn" data-action="save-weight">SAVE</button></div><div class="grid"><div class="stat"><div class="label">LATEST</div><strong>'+esc(state.weight)+' kg</strong></div><div class="stat"><div class="label">CHECK-INS</div><strong>'+state.weights.length+'</strong></div></div>')+card('<h2>Weight history</h2>'+(state.weights.length?state.weights.slice().reverse().slice(0,12).map(function(w){return '<div class="entry">'+esc(w.date)+' <strong>'+esc(w.kg)+' kg</strong></div>'}).join(''):'<div class="empty">Your check-ins will appear here.</div>'))+'<p class="note">For personal health guidance, ask your GP or a registered dietitian.</p>'}
else{var badges=[['🏁','First workout',state.sessions.length>=1],['🔥','3-day streak',activeStreak()>=3],['💪','5 workouts',state.sessions.length>=5],['⚡','7-day streak',activeStreak()>=7],['🏆','10 workouts',state.sessions.length>=10],['🌟','25 workouts',state.sessions.length>=25]];html='<div class="eyebrow">CONSISTENCY BUILDS RESULTS</div><div class="hero">STACK YOUR<br>WINS.</div>'+card('<div class="grid"><div class="stat"><div class="label">STREAK</div><strong>🔥 '+activeStreak()+' days</strong></div><div class="stat"><div class="label">WORKOUTS</div><strong>💪 '+state.sessions.length+'</strong></div></div><p class="note">A completed habit or workout counts as an active day. Rest when your body needs it.</p>')+card('<h2>Milestones</h2>'+badges.map(function(b){return '<div class="badge '+(b[2]?'':'locked')+'"><span>'+ (b[2]?b[0]:'🔒')+'</span><strong>'+b[1]+(b[2]?' · Unlocked':'')+'</strong></div>'}).join(''))+card('<h2>Recent workouts</h2>'+(state.sessions.length?state.sessions.slice(-7).reverse().map(function(s){return '<div class="entry"><strong>'+esc(s.name)+'</strong><small>'+esc(s.date)+'</small></div>'}).join(''):'<div class="empty">Your first session is waiting in Train.</div>'))}
app.innerHTML=html;drawNav()}
function generate(){var age=Number(document.getElementById('age').value),weight=Number(document.getElementById('mw').value),height=Number(document.getElementById('mh').value),activity=Number(document.getElementById('activity').value),equation=document.getElementById('equation').value,pace=Number(document.getElementById('pace').value);if(age<18||age>100||weight<35||weight>350||height<120||height>230){alert('Enter age 18+ and a valid height and weight.');return}state.age=String(age);state.weight=String(weight);state.height=String(height);state.activity=String(activity);state.equation=equation;state.pace=String(pace);var base=10*weight+6.25*height-5*age,rest=equation==='male'?[base+5]:equation==='female'?[base-161]:[base-161,base+5],maint=rest.reduce(function(sum,x){return sum+x*activity},0)/rest.length,deficit=Math.min(pace*7700/7,maint*.2),kcal=Math.round((maint-deficit)/50)*50,protein=Math.min(160,Math.round(weight*1.6)),fat=Math.round(kcal*.3/9),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));state.calorieGoal=String(kcal);state.proteinGoal=String(protein);state.macroResult={kcal:kcal,pro:protein,fat:fat,carb:carbs,maint:Math.round(maint/50)*50,warn:kcal<Math.min.apply(null,rest)};save();render()}
document.addEventListener('click',function(event){var b=event.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;save();render();return}if(b.dataset.plan!==undefined){state.plan=Number(b.dataset.plan);save();render();return}if(b.dataset.exercise!==undefined){var key=b.dataset.prefix+'-'+b.dataset.exercise;state.done[key]=!state.done[key];save();render();return}if(b.dataset.remove){state.foods=state.foods.filter(function(f){return String(f.id)!==b.dataset.remove});save();render();return}if(b.dataset.shortcut){var m=meals.concat(state.shortcuts).find(function(x){return x.id===b.dataset.shortcut});if(m){state.foods.push({id:String(Date.now()),name:m.name,cal:Number(m.cal),pro:Number(m.pro),date:today()});save();render()}return}if(b.dataset.save){var food=state.foods.find(function(f){return String(f.id)===b.dataset.save});if(food&&!state.shortcuts.some(function(x){return x.name.toLowerCase()===food.name.toLowerCase()})){state.shortcuts.push({id:'custom-'+Date.now(),name:food.name,cal:Number(food.cal)||0,pro:Number(food.pro)||0});save();alert('Saved as a shortcut.')}return}var action=b.dataset.action;if(!action)return;if(action==='train'||action==='food'){state.page=action==='train'?'Train':'Food';save();render();return}if(action==='generate'){generate();return}if(action==='apply'){state.page='Food';save();render();return}if(action.indexOf('recipe-')===0){var recipe=recipes.find(function(x){return x.id===action.slice(7)});if(recipe){state.foods.push({id:String(Date.now()),name:recipe.name,cal:recipe.cal,pro:recipe.pro,date:today()});state.page='Food';save();render()}return}if(action==='finish'){var p=plans[state.plan]||plans[0];state.sessions.push({name:p.name,date:today()});save();render();alert('Workout saved. Nice work showing up.');return}if(action==='add-food'){var name=document.getElementById('foodName').value.trim(),cal=Number(document.getElementById('foodCal').value),protein=Number(document.getElementById('foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(protein)||cal<0||protein<0){alert('Enter a meal name and valid nutrition numbers.');return}state.foods.push({id:String(Date.now()),name:name,cal:cal,pro:protein,date:today()});save();render();return}if(action==='save-weight'){var kg=Number(document.getElementById('weightInput').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kg.');return}state.weight=String(Math.round(kg*10)/10);state.weights.push({kg:state.weight,date:today()});save();render()}});
document.addEventListener('change',function(event){var el=event.target;if(el.dataset.habit!==undefined){var day=today(),i=el.dataset.habit;state.checks[day]=state.checks[day]||{};state.checks[day][i]=el.checked;save();render()}});
try{render()}catch(error){console.error('ForgedFitness render error:',error);app.innerHTML='<section class="card"><h2>Dashboard error</h2><p class="muted">The app could not draw this screen. Close this tab and reopen the latest website.</p></section>'}
})();
</script>
</body>
</html>
