<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ForgedFitness"><link rel="manifest" href="manifest.webmanifest"><title>ForgedFitness</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#34363d;--lime:#c5ff42;--orange:#ff8747;--text:#f6f7f3;--muted:#a1a4ad;--soft:#24262c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}header{height:60px;padding:0 18px;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#101114;border-bottom:1px solid var(--line)}.brand{font-weight:950;font-style:italic;letter-spacing:.5px;font-size:17px}.brand span,.eyebrow{color:var(--lime)}.small{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800}main{max-width:680px;margin:auto;padding:20px 17px}.eyebrow,.label{font-size:10px;font-weight:900;letter-spacing:1.6px}.hero{font-size:38px;line-height:1.03;font-weight:950;font-style:italic;margin:12px 0}.sub,.muted,.note{color:var(--muted);line-height:1.5}.card{background:#1b1d22;border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero-card{background:linear-gradient(135deg,#c5ff42,#8cce1e);color:#14170e;border:0}.hero-card .eyebrow,.hero-card .muted{color:#2c3c16}.between,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>*{flex:1}.metric,.big{font-size:25px;font-weight:950}.big{font-size:34px}.btn{border:0;border-radius:11px;background:var(--lime);color:#15190e;padding:11px 13px;font:inherit;font-weight:900;cursor:pointer;margin:4px 0}.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}.btn.orange{background:var(--orange);color:#21140d}input,select{width:100%;background:#131419;color:var(--text);border:1px solid #44464d;border-radius:10px;padding:12px;margin:6px 0;font:inherit}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;overflow-x:auto;background:#191a1f;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.tabs button{flex:1 0 55px;background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;padding:4px 2px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:17px;margin-bottom:3px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.tag{display:inline-block;background:#303522;color:var(--lime);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900}.note{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#141519;padding:13px;border-radius:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.warn{color:#ffd27a}h2{font-size:19px;margin:2px 0 8px}p,li{line-height:1.5}.muted{font-size:14px}
</style>
</head>
<body>
<header><div class="brand">FORGED<span>FITNESS</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app"><section class="card"><strong>Starting ForgedFitness…</strong><p class="muted">If this message stays here, the browser could not run the app. A technical error should appear below.</p></section></main>
<nav id="tabs" class="tabs" aria-label="Main navigation"></nav>
<script>window.onerror=function(message,source,line){var el=document.getElementById('app');if(el){el.innerHTML='<section class="card"><h2>App startup error</h2><p class="muted">'+String(message)+' (line '+line+')</p><p class="note">Please send this error message to Copilot.</p></section>'}return false};</script>
<script>
var app=document.getElementById('app'),nav=document.getElementById('tabs');
var KEY='forgedfitness-simple-v1';
var data={page:'Today',weight:130,foods:[],sessions:[],weights:[],shortcuts:[],checks:{},goal:'',proteinGoal:'',macro:null};
try{var stored=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(stored).forEach(function(k){data[k]=stored[k]})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function day(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function card(s){return '<section class="card">'+s+'</section>'}
function go(p){data.page=p;save();render()}
function addQuick(name,cal,pro){data.foods.push({id:String(Date.now()),name:name,cal:cal,pro:pro,date:day()});save();render()}
function streak(){var set={};data.sessions.forEach(function(s){set[s.date]=true});Object.keys(data.checks).forEach(function(k){if(data.checks[k])set[k]=true});var d=new Date(),key=function(x){return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)};if(!set[key(d)])d.setDate(d.getDate()-1);var n=0;while(set[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function render(){var names=['Today','Train','Food','Recipes','Macros','Rewards','Progress'],icons=['⌂','✣','＋','♨','◎','★','↗'];var navhtml='';for(var i=0;i<names.length;i++){navhtml+='<button class="'+(data.page===names[i]?'active':'')+'" onclick="go(\''+names[i]+'\')"><span>'+icons[i]+'</span>'+names[i]+'</button>'}nav.innerHTML=navhtml;var html='',todayFoods=data.foods.filter(function(x){return x.date===day()}),cal=todayFoods.reduce(function(a,x){return a+(Number(x.cal)||0)},0),protein=todayFoods.reduce(function(a,x){return a+(Number(x.pro)||0)},0);
if(data.page==='Today'){html='<div class="eyebrow">YOUR FITNESS JOURNEY</div><div class="hero">BUILD YOURSELF.</div><p class="sub">Lose fat. Build strength. Keep showing up.</p>'+card('<div class="eyebrow">TODAY’S MISSION</div><h2>One day stronger.</h2><p class="muted">A little progress beats no progress.</p><button class="btn orange" onclick="go(\'Train\')">START A WORKOUT</button>')+card('<div class="between"><div><div class="label">FOOD TODAY</div><div class="metric">'+cal+' kcal</div></div><div><div class="label">PROTEIN</div><div class="metric">'+protein+' g</div></div></div><button class="btn alt" onclick="go(\'Food\')">OPEN FOOD LOG</button>')+card('<div class="eyebrow">YOUR STREAK</div><div class="big">🔥 '+streak()+' days</div><p class="note">Log a workout or check a daily habit to build consistency.</p>')+'<p class="note">Starting details: 6 ft 5 in, about 20–21 stone. Update your current weight in Progress.</p>'}
else if(data.page==='Train'){var workouts=[['Upper A','Chest press · Lat pulldown · Seated row · Shoulder press'],['Lower A','Leg press · Leg curl · Leg extension · Calf raise'],['Upper B','Chest-supported row · Incline press · Pulldown · Lateral raise'],['Lower B','Hip thrust · Leg curl · Supported split squat · Pallof press']];html='<div class="eyebrow">STRENGTH TRAINING</div><div class="hero">THE WORK.</div><p class="sub">Choose a session. Use controlled reps and comfortable weights.</p>';for(var w=0;w<workouts.length;w++){html+=card('<span class="tag">SESSION '+(w+1)+'</span><h2>'+workouts[w][0]+'</h2><p class="muted">'+workouts[w][1]+'</p><button class="btn" onclick="finishWorkout(\''+workouts[w][0]+'\')">FINISH WORKOUT</button>')}html+='<p class="note">Stop if you feel sharp or worsening pain. Ask a qualified trainer if unsure about technique.</p>'}
else if(data.page==='Food'){var meals=[['Protein oats & banana',420,26],['Greek yoghurt & berries',250,20],['Eggs on wholemeal toast',380,24],['Tuna jacket potato',460,34]];html='<div class="eyebrow">FUEL THE WORK</div><div class="hero">FOOD LOG.</div>'+card('<h2>Meal shortcuts</h2><p class="note">Approximate values per serving.</p>');for(var m=0;m<meals.length;m++){html+='<section class="card"><div class="between"><span><strong>'+meals[m][0]+'</strong><div class="note">'+meals[m][1]+' kcal · '+meals[m][2]+' g protein</div></span><button class="btn" onclick="addQuick(\''+meals[m][0]+'\','+meals[m][1]+','+meals[m][2]+')">ADD</button></div></section>'}html+=card('<h2>Add a meal</h2><input id="foodName" placeholder="Food name"><div class="row"><input id="foodCalories" type="number" placeholder="Calories"><input id="foodProtein" type="number" placeholder="Protein g"></div><button class="btn" onclick="addFood()">SAVE MEAL</button>')+card('<h2>Today</h2>'+(todayFoods.length?todayFoods.map(function(f){return '<div class="item">'+esc(f.name)+' · '+f.cal+' kcal · '+f.pro+' g protein <button class="btn alt" onclick="removeFood(\''+f.id+'\')">REMOVE</button></div>'}).join(''):'<p class="muted">No food logged yet.</p>')+'<p><strong>Total: '+cal+' kcal · '+protein+' g protein</strong></p>')}
else if(data.page==='Recipes'){var rs=[['Chicken rice bowl','560','43','Chicken breast, rice, frozen vegetables. Cook rice; pan-cook chicken fully; heat veg and serve.'],['Easy bean chilli','430','22','Mixed beans, chopped tomatoes, paprika. Simmer together for 15–20 minutes; serve with rice or potato.'],['Tuna jacket potato','490','36','Potato, tuna, plain yoghurt, optional sweetcorn. Cook potato until soft and add tuna mixture.'],['Tofu noodles','520','25','Tofu, noodles, mixed veg, soy sauce. Cook noodles; brown tofu, heat vegetables, combine.']];html='<div class="eyebrow">SIMPLE MEAL IDEAS</div><div class="hero">RECIPES.</div><p class="sub">Nutrition is an estimate; portions and ingredients change it.</p>';for(var r=0;r<rs.length;r++){html+=card('<h2>'+rs[r][0]+'</h2><div class="note">About '+rs[r][1]+' kcal · '+rs[r][2]+' g protein</div><p class="muted">'+rs[r][3]+'</p><button class="btn alt" onclick="addQuick(\''+rs[r][0]+'\','+rs[r][1]+','+rs[r][2]+')">ADD TO FOOD LOG</button>') }html+='<p class="note">Follow food-safety guidance and adjust ingredients for allergies or dietary needs.</p>'}
else if(data.page==='Macros'){html='<div class="eyebrow">ON-DEVICE ESTIMATE</div><div class="hero">MACRO STARTER.</div><p class="sub">A basic estimate—not AI and not medical advice. For adults 18+.</p>'+card('<label>Age<input id="macroAge" type="number" min="18" max="100" placeholder="Age"></label><label>Weight kg<input id="macroWeight" type="number" min="35" max="350" step="0.1" value="'+esc(data.weight)+'"></label><label>Height cm<input id="macroHeight" type="number" min="120" max="230" value="196"></label><label>Equation<select id="macroSex"><option value="range">Show range</option><option value="male">Male equation</option><option value="female">Female equation</option></select></label><label>Activity<select id="macroActivity"><option value="1.2">Mostly sitting</option><option value="1.375">Light activity</option><option value="1.55">Moderate activity</option></select></label><label>Goal<select id="macroGoal"><option value="0">Maintenance</option><option value="250">Gentle weight-loss estimate</option><option value="500">Moderate weight-loss estimate</option></select></label><button class="btn orange" onclick="generateMacros()">GENERATE</button>');if(data.macro){html+=card('<h2>Rough daily targets</h2><div class="grid"><div class="stat"><div class="label">CALORIES</div><strong>'+data.macro.cal+' kcal</strong></div><div class="stat"><div class="label">PROTEIN</div><strong>'+data.macro.pro+' g</strong></div><div class="stat"><div class="label">CARBS</div><strong>'+data.macro.carb+' g</strong></div><div class="stat"><div class="label">FAT</div><strong>'+data.macro.fat+' g</strong></div></div><p class="note">Estimate only. Needs vary; speak with a GP or registered dietitian for personal advice.</p><button class="btn alt" onclick="applyMacros()">USE IN FOOD TAB</button>')}}
else if(data.page==='Rewards'){var total=data.sessions.length,st=streak(),badges=[['🏁','First workout',total>=1],['🔥','3-day streak',st>=3],['💪','5 workouts',total>=5],['⚡','7-day streak',st>=7],['🏆','10 workouts',total>=10],['🌟','25 workouts',total>=25]];html='<div class="eyebrow">CONSISTENCY BUILDS RESULTS</div><div class="hero">YOUR WINS.</div>'+card('<h2>Progress</h2><p class="big">🔥 '+st+' day streak</p><p class="muted">'+total+' workouts completed</p>');for(var b=0;b<badges.length;b++){html+=card((badges[b][2]?'✅ ':'🔒 ')+badges[b][1])}}
else{html='<div class="eyebrow">PROGRESS</div><div class="hero">CHECK IN.</div>'+card('<label>Current weight (kg)<input id="weightInput" type="number" min="1" max="500" step="0.1" value="'+esc(data.weight)+'"></label><button class="btn" onclick="saveWeight()">SAVE WEIGHT</button>')+card('<h2>Weight check-ins</h2>'+(data.weights.length?data.weights.slice().reverse().map(function(x){return '<div class="item">'+x.date+' — '+x.kg+' kg</div>'}).join(''):'<p class="muted">No check-ins yet.</p>'))}
app.innerHTML=html;
}
function finishWorkout(name){data.sessions.push({name:name,date:day()});save();render();alert('Workout saved. Nice work showing up!')}
function addFood(){var n=document.getElementById('foodName').value.trim(),c=Number(document.getElementById('foodCalories').value),p=Number(document.getElementById('foodProtein').value);if(!n||c<0||p<0){alert('Enter the food and nutrition numbers.');return}addQuick(n,c,p)}
function removeFood(id){data.foods=data.foods.filter(function(x){return x.id!==id});save();render()}
function saveWeight(){var n=Number(document.getElementById('weightInput').value);if(n<1||n>500){alert('Enter a valid weight in kg.');return}data.weight=String(n);data.weights.push({date:day(),kg:n});save();render()}
function generateMacros(){var age=Number(document.getElementById('macroAge').value),weight=Number(document.getElementById('macroWeight').value),height=Number(document.getElementById('macroHeight').value),activity=Number(document.getElementById('macroActivity').value),sex=document.getElementById('macroSex').value,goal=Number(document.getElementById('macroGoal').value);if(age<18||age>100||weight<35||height<120){alert('Enter age 18+ plus valid height and weight.');return}var base=10*weight+6.25*height-5*age,rest=sex==='male'?[base+5]:sex==='female'?[base-161]:[base-161,base+5],maintenance=0;for(var i=0;i<rest.length;i++)maintenance+=rest[i]*activity;maintenance=maintenance/rest.length;var cal=Math.round(Math.max(1200,maintenance-goal)/50)*50,pro=Math.min(160,Math.round(weight*1.6)),fat=Math.round(cal*.3/9),carb=Math.max(0,Math.round((cal-pro*4-fat*9)/4));data.macro={cal:cal,pro:pro,fat:fat,carb:carb};data.goal=String(cal);data.proteinGoal=String(pro);save();render()}
function applyMacros(){alert('Macro estimates saved. Your calorie and protein goals are shown in the Food tab.')}
document.addEventListener('change',function(e){if(e.target.classList.contains('check')){data.checks[day()]=data.checks[day()]||{};data.checks[day()].done=e.target.checked;save()}});
try{render()}catch(error){app.innerHTML='<section class="card"><h2>App error</h2><p class="muted">'+esc(error.message)+'</p><p class="note">Send this message to Copilot.</p></section>'}
</script>
</body>
</html>
