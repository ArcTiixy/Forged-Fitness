<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#34363d;--lime:#c5ff42;--orange:#ff8747;--text:#f6f7f3;--muted:#a1a4ad;--soft:#24262c;--danger:#ff9e92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}header{height:60px;padding:0 18px;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#101114;border-bottom:1px solid var(--line)}.brand{font-weight:950;font-style:italic;letter-spacing:.5px;font-size:17px}.brand span,.eyebrow{color:var(--lime)}.small{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800}main{max-width:680px;margin:auto;padding:20px 17px}.eyebrow,.label{font-size:10px;font-weight:900;letter-spacing:1.6px}.hero{font-size:38px;line-height:1.03;font-weight:950;font-style:italic;margin:12px 0}.sub,.muted,.note{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#202228,#191a1f);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero-card{background:linear-gradient(135deg,#c5ff42,#8cce1e);color:#14170e;border:0}.hero-card .eyebrow,.hero-card .muted{color:#2c3c16}.hero-card .hero{font-size:28px}.label{color:var(--muted)}.row,.between{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.row>*{flex:1}.metric{font-size:24px;font-weight:950}.big{font-size:34px;font-weight:950}.btn{border:0;border-radius:11px;background:var(--lime);color:#15190e;padding:11px 13px;font:inherit;font-weight:900;cursor:pointer}.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}.btn.orange{background:var(--orange);color:#21140d}.btn.red{background:#402b28;color:var(--danger)}.btn.small-btn{padding:8px 10px;font-size:12px}input,select{width:100%;background:#131419;color:var(--text);border:1px solid #44464d;border-radius:10px;padding:12px;margin:6px 0;font:inherit}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;overflow-x:auto;background:#191a1f;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.tabs button{flex:1 0 58px;background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;padding:4px 2px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:17px;margin-bottom:3px}.pills{display:flex;gap:7px;overflow:auto;margin:15px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:800}.pill.sel{background:var(--lime);color:#15190e}.exercise,.entry,.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px}.tag{display:inline-block;background:#303522;color:var(--lime);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900}.check{width:20px;height:20px;accent-color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.macro{background:#141519;padding:13px;border-radius:12px}.stat strong,.macro strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}.track{height:8px;background:#3a3b40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}.recipe,.shortcut{background:#15161a;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.badge{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.badge-icon{font-size:24px;width:36px;text-align:center}.locked{opacity:.48}.quote{font-size:21px;font-weight:900;font-style:italic;line-height:1.4}.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.warn{color:#ffd27a}h2{font-size:19px;margin:2px 0 8px}p{line-height:1.5}@media(min-width:650px){main{padding-top:28px}}

<body>
<header><div class="brand">FORGED<span>FITNESS</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app"><section class="card"><strong>Starting ForgedFitness…</strong><p class="muted">If this message stays here, refresh the page once.</p></section></main>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),nav=document.getElementById('tabs'),KEY='forgedfitness-stable-v3';
var defaults={page:'Today',plan:0,weight:'130',height:'196',age:'',equation:'range',activity:'1.375',pace:'0.25',foods:[],weights:[],sessions:[],checks:{},done:{},shortcuts:[],calorieGoal:'',proteinGoal:'',macroResult:null};
var state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(error){state=Object.assign({},defaults)}
state.foods=Array.isArray(state.foods)?state.foods:[];state.weights=Array.isArray(state.weights)?state.weights:[];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.shortcuts=Array.isArray(state.shortcuts)?state.shortcuts:[];state.checks=state.checks||{};state.done=state.done||{};
var plans=[{name:'Upper A',focus:'CHEST · BACK · SHOULDERS',moves:[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]},{name:'Lower A',focus:'QUADS · HAMSTRINGS · CORE',moves:[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]},{name:'Upper B',focus:'BACK · CHEST · ARMS',moves:[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]},{name:'Lower B',focus:'GLUTES · HAMSTRINGS · CORE',moves:[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]}];
var habits=['Get some planned movement','Eat a protein-rich food','Have fruit or vegetables','Make time for good sleep'];
var quotes=['Show up. Put in the work. Get a little stronger.','You do not need a perfect day. Just make the next good choice.','Strength is built one rep—and one return to the gym—at a time.','The scale is one stat. Your effort is the real score.','Rest is training too. Recover, then come back ready.','Small wins stack up. Keep building.'];
var starterMeals=[{id:'oats',name:'Protein oats & banana',cal:420,pro:26},{id:'yoghurt',name:'Greek yoghurt & berries',cal:250,pro:20},{id:'eggs',name:'Eggs on wholemeal toast',cal:380,pro:24},{id:'tuna',name:'Tuna jacket potato',cal:460,pro:34}];
var recipes=[{id:'chicken',name:'Chicken, rice & veg bowl',time:'25 min',cal:560,pro:43,items:['150 g chicken breast','75 g dry rice','Frozen vegetables','Seasoning'],steps:'Cook rice. Cook chicken thoroughly in a pan, heat vegetables, and serve together.'},{id:'chilli',name:'Easy bean chilli',time:'25 min',cal:430,pro:22,items:['1 can mixed beans','1 can chopped tomatoes','Chilli powder or paprika','Rice or potato'],steps:'Add beans, tomatoes and seasoning to a pan. Simmer for 15–20 minutes and serve.'},{id:'potato',name:'Tuna jacket potato',time:'15 min',cal:490,pro:36,items:['1 medium-large potato','1 small can tuna','Plain yoghurt or light mayo','Sweetcorn or salad'],steps:'Cook potato until soft. Mix tuna with yoghurt or mayo, split potato and add toppings.'},{id:'tofu',name:'Quick tofu & veg noodles',time:'20 min',cal:520,pro:25,items:['150 g firm tofu','Noodles','Mixed vegetables','Soy sauce'],steps:'Cook noodles. Brown tofu, add vegetables and cook until hot. Stir through noodles and seasoning.'}];
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function dayKey(date){date=date||new Date();return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(error){}}
function card(content,extra){return '<section class="card '+(extra||'')+'">'+content+'</section>'}
function btn(text,action,extra){return '<button class="btn '+(extra||'')+'" data-action="'+action+'">'+text+'</button>'}
function todayFoods(){return state.foods.filter(function(item){return item.date===dayKey()})}
function streak(){var active={};state.sessions.forEach(function(s){if(s.date)active[s.date]=true});Object.keys(state.checks).forEach(function(day){var values=state.checks[day]||{};if(Object.keys(values).some(function(k){return values[k]}))active[day]=true});var date=new Date();if(!active[dayKey(date)])date.setDate(date.getDate()-1);var total=0;while(active[dayKey(date)]){total++;date.setDate(date.getDate()-1)}return total}
function weeklyCount(){var start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-6);return state.sessions.filter(function(s){return new Date(s.date+'T12:00:00')>=start}).length}
function navHTML(){var pages=[['Today','⌂'],['Train','✣'],['Food','＋'],['Recipes','♨'],['Macros','◎'],['Progress','↗'],['Rewards','★']];nav.innerHTML=pages.map(function(item){return '<button class="'+(state.page===item[0]?'active':'')+'" data-page="'+item[0]+'"><span>'+item[1]+'</span>'+item[0]+'</button>'}).join('')}
function macroHTML(){var content='<div class="eyebrow">FREE ON-DEVICE ESTIMATOR</div><div class="hero">YOUR MACROS.<br>YOUR START.</div><p class="sub">A basic estimate from the details you enter. This is not AI; no personal details are sent anywhere.</p>';
content+=card('<h2>About you</h2><p class="note">For adults 18+ only. This common equation has different options; choose “Show range” if you prefer not to select one.</p><div class="row"><label>Age<input id="mAge" type="number" min="18" max="100" value="'+esc(state.age)+'" placeholder="Years"></label><label>Weight<input id="mWeight" type="number" min="35" max="350" step="0.1" value="'+esc(state.weight)+'" placeholder="kg"></label></div><div class="row"><label>Height<input id="mHeight" type="number" min="120" max="230" value="'+esc(state.height)+'" placeholder="cm"></label><label>Activity<select id="mActivity"><option value="1.2">Mostly sitting</option><option value="1.375">Light activity</option><option value="1.55">Moderate activity</option><option value="1.725">Very active</option></select></label></div><label>Equation<select id="mEquation"><option value="range">Show a range</option><option value="male">Male equation</option><option value="female">Female equation</option></select></label><label>Goal pace<select id="mPace"><option value="0">Maintenance estimate</option><option value="0.25">Gentle loss estimate</option><option value="0.5">Moderate loss estimate</option></select></label><p class="note">Activity and calorie needs are estimates. If unsure, choose the lower activity option.</p>'+btn('GENERATE ESTIMATE','macro-generate','orange'));
if(state.macroResult){var r=state.macroResult;content+=card('<h2>Rough daily estimate</h2><span class="tag">ESTIMATE · NOT A PRESCRIPTION</span><div class="macro-grid"><div class="macro"><span class="label">CALORIES</span><strong>'+r.kcal.toLocaleString()+'</strong><span class="note">kcal/day</span></div><div class="macro"><span class="label">PROTEIN</span><strong>'+r.pro+' g</strong><span class="note">per day</span></div><div class="macro"><span class="label">CARBS</span><strong>'+r.carb+' g</strong><span class="note">per day</span></div><div class="macro"><span class="label">FAT</span><strong>'+r.fat+' g</strong><span class="note">per day</span></div></div><p class="note">Estimated maintenance: about '+r.maint.toLocaleString()+' kcal/day. Protein, fat and carbs use simple rules of thumb and may not fit your needs.</p>'+(r.warn?'<p class="note warn">This estimate is close to or below the calculated resting-energy estimate. Please ask a GP or dietitian before using it.</p>':'')+btn('USE CALORIE & PROTEIN GOALS','macro-apply','alt'))}
content+='<p class="note">Not for under-18s, pregnancy or breastfeeding, eating-disorder history, or medically managed nutrition. Ask a GP or registered dietitian for tailored advice. Estimates can be inaccurate.</p>';return content}
function render(){var foods=todayFoods(),kcal=foods.reduce(function(n,f){return n+(Number(f.cal)||0)},0),protein=foods.reduce(function(n,f){return n+(Number(f.pro)||0)},0),html='';
if(state.page==='Today'){
var checks=state.checks[dayKey()]||{};html='<div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+'</div><div class="hero">BUILD<br>YOURSELF.</div><p class="sub">Lose fat. Build strength. Keep showing up.</p>'+card('<div class="eyebrow">TODAY’S MISSION</div><div class="hero">One day stronger.</div><p class="muted">A little progress beats no progress.</p>'+btn('START A WORKOUT','go-train','orange'),'hero-card')+card('<div class="between"><div><div class="label">WORKOUTS · LAST 7 DAYS</div><div class="big">'+weeklyCount()+' sessions</div></div><span class="tag">🔥 '+streak()+' DAY STREAK</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,weeklyCount()/4*100)+'%"></div></div><p class="note">A manageable starting goal is 2–4 strength sessions each week.</p>')+card('<div class="between"><div><div class="label">FOOD LOG</div><div class="metric">'+kcal+' kcal</div></div><div><div class="label">PROTEIN</div><div class="metric">'+protein+' g</div></div></div>'+btn('LOG FOOD','go-food','alt'))+card('<div class="label">DAILY DISCIPLINE</div>'+habits.map(function(h,i){return '<label class="habit"><span>'+h+'</span><input class="check" type="checkbox" data-habit="'+i+'" '+(checks[i]?'checked':'')+'></label>'}).join(''))+'<p class="note">Profile starts at 6 ft 5 in and about 20–21 stone, as you shared. Change your weight in Progress; optional macro estimates are in Macros.</p>';
}else if(state.page==='Train'){
var index=Math.max(0,Math.min(plans.length-1,Number(state.plan)||0)),plan=plans[index],prefix=dayKey()+'-'+index;html='<div class="eyebrow">THE WORK</div><div class="hero">NO EXCUSES.<br>JUST REPS.</div><p class="sub">Four-day upper/lower plan. Use comfortable loads and good form.</p><div class="pills">'+plans.map(function(p,i){return '<button class="pill '+(i===index?'sel':'')+'" data-plan="'+i+'">'+p.name+'</button>'}).join('')+'</div>'+card('<span class="tag">'+plan.focus+'</span><h2>'+plan.name+'</h2>'+plan.moves.map(function(move,i){var key=prefix+'-'+i;return '<div class="exercise"><div><strong class="'+(state.done[key]?'done':'')+'">'+move[0]+'</strong><small>'+move[1]+'</small></div><button class="btn alt" data-exercise="'+i+'" data-prefix="'+prefix+'">'+(state.done[key]?'DONE ✓':'CHECK')+'</button></div>'}).join('')+btn('FINISH WORKOUT','finish'))+'<p class="note">Stop if you feel sharp or worsening pain. Ask a qualified trainer for technique help if needed.</p>';
}else if(state.page==='Food'){
var quick=starterMeals.concat(state.shortcuts);html='<div class="eyebrow">FUEL THE WORK</div><div class="hero">EAT WELL.<br>GET STRONG.</div>'+card('<h2>Quick meal shortcuts</h2><p class="note">Nutrition values are approximate; portions and ingredients change them.</p>'+quick.map(function(item){return '<div class="shortcut"><div class="between"><span><strong>'+esc(item.name)+'</strong><small>'+item.cal+' kcal · '+item.pro+' g protein</small></span><button class="btn small-btn" data-shortcut="'+esc(item.id)+'">ADD</button></div></div>'}).join(''))+card('<h2>Daily targets</h2><p class="note">Optional. Use Macros for a rough estimate, or leave these unset.</p><div class="row"><div class="macro"><span class="label">CALORIES</span><strong>'+esc(state.calorieGoal||'Not set')+'</strong></div><div class="macro"><span class="label">PROTEIN</span><strong>'+esc(state.proteinGoal?state.proteinGoal+' g':'Not set')+'</strong></div></div><button class="btn alt" data-page="Macros">OPEN MACROS</button>')+card('<h2>Log a meal</h2><input id="foodName" placeholder="Meal name"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>'+btn('ADD TO TODAY','add-food'))+card('<h2>Today’s log</h2>'+(foods.length?foods.map(function(f){return '<div class="entry"><span>'+esc(f.name)+'<small>'+f.cal+' kcal · '+f.pro+' g protein</small></span><div><button class="btn alt small-btn" data-save-shortcut="'+esc(f.id)+'">SAVE</button> <button class="btn red small-btn" data-remove="'+esc(f.id)+'">×</button></div></div>'}).join(''):'<div class="empty">Nothing logged yet.</div>')+'<div class="divider"></div><strong>TOTAL: '+kcal+' kcal · '+protein+' g protein</strong>');
}else if(state.page==='Recipes'){
html='<div class="eyebrow">SIMPLE FOOD IDEAS</div><div class="hero">RECIPES THAT<br>FUEL YOU.</div><p class="sub">Easy meal ideas with estimated nutrition per serving.</p>'+recipes.map(function(r){return card('<div class="between"><h2>'+r.name+'</h2><span class="tag">'+r.time+'</span></div><p class="muted">About '+r.cal+' kcal · '+r.pro+' g protein</p><strong>Ingredients</strong><ul>'+r.items.map(function(item){return '<li>'+esc(item)+'</li>'}).join('')+'</ul><p class="muted">'+r.steps+'</p>'+btn('ADD TO FOOD LOG','recipe-'+r.id,'alt')}).join('')+'<p class="note">Follow food-safety advice and adjust for allergies or dietary needs.</p>';
}else if(state.page==='Macros'){html=macroHTML()}
else if(state.page==='Progress'){
html='<div class="eyebrow">PROOF OF YOUR WORK</div><div class="hero">TRACK THE<br>COMEBACK.</div>'+card('<h2>Weight check-in</h2><p class="muted">Enter weight in kilograms.</p><div class="row"><input id="weightInput" type="number" min="1" max="500" step="0.1" value="'+esc(state.weight)+'"><button class="btn" data-action="save-weight">SAVE</button></div><div class="grid"><div class="stat"><div class="label">LATEST</div><strong>'+esc(state.weight)+' kg</strong></div><div class="stat"><div class="label">CHECK-INS</div><strong>'+state.weights.length+'</strong></div></div>')+card('<h2>Weight history</h2>'+(state.weights.length?state.weights.slice().reverse().slice(0,12).map(function(w){return '<div class="entry">'+esc(w.date)+' <strong>'+esc(w.kg)+' kg</strong></div>'}).join(''):'<div class="empty">Your check-ins will appear here.</div>'))+'<p class="note">For personal health or nutrition advice, speak with your GP or a registered dietitian.</p>';
}else{
var badgeList=[{icon:'🏁',name:'First workout',ok:state.sessions.length>=1},{icon:'🔥',name:'3-day active streak',ok:streak()>=3},{icon:'💪',name:'5 workouts',ok:state.sessions.length>=5},{icon:'⚡',name:'7-day active streak',ok:streak()>=7},{icon:'🏆',name:'10 workouts',ok:state.sessions.length>=10},{icon:'🌟',name:'25 workouts',ok:state.sessions.length>=25}];html='<div class="eyebrow">CONSISTENCY BUILDS RESULTS</div><div class="hero">STACK YOUR<br>WINS.</div>'+card('<div class="grid"><div class="stat"><div class="label">CURRENT STREAK</div><strong>🔥 '+streak()+' days</strong></div><div class="stat"><div class="label">WORKOUTS LOGGED</div><strong>💪 '+state.sessions.length+'</strong></div></div><p class="note">A checked daily habit or logged workout counts as an active day. Rest when your body needs it.</p>')+card('<h2>Milestones</h2>'+badgeList.map(function(b){return '<div class="badge '+(b.ok?'':'locked')+'"><span class="badge-icon">'+(b.ok?b.icon:'🔒')+'</span><strong>'+b.name+(b.ok?' · Unlocked':'')+'</strong></div>'}).join(''))+card('<h2>Recent workouts</h2>'+(state.sessions.length?state.sessions.slice(-7).reverse().map(function(s){return '<div class="entry"><strong>'+esc(s.name)+'</strong><small>'+esc(s.date)+'</small></div>'}).join(''):'<div class="empty">Your first session is waiting in Train.</div>'));
}
app.innerHTML=html;navHTML();
}
function generateMacros(){var age=Number(document.getElementById('mAge').value),weight=Number(document.getElementById('mWeight').value),height=Number(document.getElementById('mHeight').value),activity=Number(document.getElementById('mActivity').value),equation=document.getElementById('mEquation').value,pace=Number(document.getElementById('mPace').value);if(age<18||age>100||weight<35||weight>350||height<120||height>230){alert('Enter age 18+ and a valid height and weight.');return}state.age=String(age);state.weight=String(weight);state.height=String(height);state.activity=String(activity);state.equation=equation;state.pace=String(pace);var base=10*weight+6.25*height-5*age,rest=equation==='male'?[base+5]:equation==='female'?[base-161]:[base-161,base+5],maintenance=rest.reduce(function(a,b){return a+b*activity},0)/rest.length,deficit=Math.min(pace*7700/7,maintenance*.2),kcal=Math.round((maintenance-deficit)/50)*50,pro=Math.min(160,Math.round(weight*1.6)),fat=Math.round(kcal*.3/9),carb=Math.max(0,Math.round((kcal-pro*4-fat*9)/4));state.calorieGoal=String(kcal);state.proteinGoal=String(pro);state.macroResult={kcal:kcal,pro:pro,fat:fat,carb:carb,maint:Math.round(maintenance/50)*50,warn:kcal<Math.min.apply(null,rest)};save();render()}
document.addEventListener('click',function(event){var button=event.target.closest('button');if(!button)return;if(button.dataset.page){state.page=button.dataset.page;save();render();return}if(button.dataset.plan!==undefined){state.plan=Number(button.dataset.plan);save();render();return}if(button.dataset.exercise!==undefined){var key=button.dataset.prefix+'-'+button.dataset.exercise;state.done[key]=!state.done[key];save();render();return}if(button.dataset.remove){state.foods=state.foods.filter(function(f){return String(f.id)!==button.dataset.remove});save();render();return}if(button.dataset.shortcut){var meal=starterMeals.concat(state.shortcuts).find(function(m){return m.id===button.dataset.shortcut});if(meal){state.foods.push({id:String(Date.now()),name:meal.name,cal:Number(meal.cal),pro:Number(meal.pro),date:dayKey()});save();render()}return}if(button.dataset.saveShortcut){var food=state.foods.find(function(f){return String(f.id)===button.dataset.saveShortcut});if(food&&!state.shortcuts.some(function(m){return m.name.toLowerCase()===food.name.toLowerCase()})){state.shortcuts.push({id:'custom-'+Date.now(),name:food.name,cal:Number(food.cal)||0,pro:Number(food.pro)||0});save();alert('Saved as a shortcut.')}return}var action=button.dataset.action;if(!action)return;if(action==='go-train'){state.page='Train';save();render();return}if(action==='go-food'){state.page='Food';save();render();return}if(action==='macro-generate'){generateMacros();return}if(action==='macro-apply'){state.page='Food';save();render();return}if(action.indexOf('recipe-')===0){var recipe=recipes.find(function(r){return r.id===action.slice(7)});if(recipe){state.foods.push({id:String(Date.now()),name:recipe.name,cal:recipe.cal,pro:recipe.pro,date:dayKey()});state.page='Food';save();render()}return}if(action==='finish'){var p=plans[state.plan]||plans[0];state.sessions.push({name:p.name,date:dayKey()});save();render();alert('Workout saved. Nice work showing up.');return}if(action==='add-food'){var name=document.getElementById('foodName').value.trim(),cal=Number(document.getElementById('foodCal').value),proteinValue=Number(document.getElementById('foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(proteinValue)||cal<0||proteinValue<0){alert('Enter a meal name and valid nutrition numbers.');return}state.foods.push({id:String(Date.now()),name:name,cal:cal,pro:proteinValue,date:dayKey()});save();render();return}if(action==='save-weight'){var kg=Number(document.getElementById('weightInput').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kg.');return}state.weight=String(Math.round(kg*10)/10);state.weights.push({kg:state.weight,date:dayKey()});save();render()}});
document.addEventListener('change',function(event){var target=event.target;if(target.dataset.habit!==undefined){var key=dayKey(),index=target.dataset.habit;state.checks[key]=state.checks[key]||{};state.checks[key][index]=target.checked;save();render()}if(target.id==='mActivity')state.activity=target.value;if(target.id==='mEquation')state.equation=target.value;if(target.id==='mPace')state.pace=target.value;if(target.dataset.field){state[target.dataset.field]=target.value;save()}});
try{render()}catch(error){console.error('ForgedFitness render error:',error);app.innerHTML='<section class="card"><h2>Could not load the dashboard</h2><p class="muted">Close and reopen the page, then refresh once.</p></section>'}
})();
