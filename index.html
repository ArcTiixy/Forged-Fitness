<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#34363d;--lime:#c5ff42;--orange:#ff8747;--text:#f6f7f3;--muted:#a1a4ad;--soft:#24262c;--danger:#ff9e92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}header{height:60px;padding:0 18px;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#101114;border-bottom:1px solid var(--line)}.brand{font-weight:950;font-style:italic;letter-spacing:.5px;font-size:17px}.brand span,.eyebrow{color:var(--lime)}.small{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800}main{max-width:680px;margin:auto;padding:20px 17px}.eyebrow,.label{font-size:10px;font-weight:900;letter-spacing:1.6px}.hero{font-size:38px;line-height:1.03;font-weight:950;font-style:italic;margin:12px 0}.sub,.muted,.note{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#202228,#191a1f);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero-card{background:linear-gradient(135deg,#c5ff42,#8cce1e);color:#14170e;border:0}.hero-card .eyebrow,.hero-card .muted{color:#2c3c16}.hero-card .hero{font-size:28px}.label{color:var(--muted)}.row,.between{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.row>*{flex:1}.metric{font-size:24px;font-weight:950}.big{font-size:34px;font-weight:950}.btn{border:0;border-radius:11px;background:var(--lime);color:#15190e;padding:11px 13px;font:inherit;font-weight:900;cursor:pointer}.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}.btn.orange{background:var(--orange);color:#21140d}.btn.red{background:#402b28;color:var(--danger)}.btn.small-btn{padding:8px 10px;font-size:12px}input,select{width:100%;background:#131419;color:var(--text);border:1px solid #44464d;border-radius:10px;padding:12px;margin:6px 0;font:inherit}input::placeholder{color:#777a83}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;overflow-x:auto;justify-content:flex-start;background:#191a1f;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 58px;background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;padding:4px 2px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:17px;margin-bottom:3px}.pills{display:flex;gap:7px;overflow:auto;margin:15px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:800}.pill.sel{background:var(--lime);color:#15190e}.exercise,.entry,.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px}.tag{display:inline-block;background:#303522;color:var(--lime);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900}.check{width:20px;height:20px;accent-color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#141519;padding:13px;border-radius:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}.track{height:8px;background:#3a3b40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}h2{font-size:19px;margin:2px 0 8px}h3{font-size:16px;margin:4px 0}.recipe,.shortcut{background:#15161a;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.recipe p{margin:7px 0}.badge{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.badge:last-child{border:0}.badge-icon{font-size:24px;width:36px;text-align:center}.locked{opacity:.48}.quote{font-size:21px;font-weight:900;font-style:italic;line-height:1.4}.result{border:1px solid #617d2a;background:#20291a;border-radius:12px;padding:14px;margin-top:12px}.warn{color:#ffd27a}.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.macro{background:#141519;border-radius:11px;padding:12px}.macro strong{display:block;font-size:22px;margin-top:4px}@media(min-width:650px){main{padding-top:28px}}
</style>

<body>
<header><div class="brand">FORGED<span>FITNESS</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app"><section class="card"><strong>Loading ForgedFitness…</strong><p class="muted">Your training dashboard will appear in a moment.</p></section></main>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<script>
(function(){'use strict';
var app=document.getElementById('app'),tabs=document.getElementById('tabs'),storageKey='forgedfitness-v2';
function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var defaults={page:'Today',plan:0,weight:'130',height:'196',age:'',equation:'',activity:'1.375',pace:'0.25',foods:[],weights:[],sessions:[],checks:{},done:{},shortcuts:[],calorieGoal:'',proteinGoal:'',macroResult:null};
var state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){state=Object.assign({},defaults)}
state.foods=Array.isArray(state.foods)?state.foods:[];state.weights=Array.isArray(state.weights)?state.weights:[];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.shortcuts=Array.isArray(state.shortcuts)?state.shortcuts:[];state.checks=state.checks||{};state.done=state.done||{};
var plans=[{name:'Upper A',focus:'CHEST · BACK · SHOULDERS',moves:[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]},{name:'Lower A',focus:'QUADS · HAMSTRINGS · CORE',moves:[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]},{name:'Upper B',focus:'BACK · CHEST · ARMS',moves:[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]},{name:'Lower B',focus:'GLUTES · HAMSTRINGS · CORE',moves:[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]}];
var habits=['Get some planned movement','Eat a protein-rich food','Have fruit or vegetables','Make time for good sleep'];
var quotes=['Show up. Put in the work. Get a little stronger.','You do not need a perfect day. Just make the next good choice.','Strength is built one rep—and one return to the gym—at a time.','The scale is one stat. Your effort is the real score.','Rest is training too. Recover, then come back ready.','Small wins stack up. Keep building.'];
var starterShortcuts=[{id:'starter-oats',name:'Protein oats & banana',cal:420,pro:26},{id:'starter-yoghurt',name:'Greek yoghurt & berries',cal:250,pro:20},{id:'starter-eggs',name:'Eggs on wholemeal toast',cal:380,pro:24},{id:'starter-tuna',name:'Tuna jacket potato',cal:460,pro:34}];
var recipes=[{id:'chicken-rice',name:'Chicken, rice & veg bowl',time:'25 min',cal:560,pro:43,ingredients:['150 g chicken breast','75 g dry rice','1–2 handfuls frozen vegetables','1 tsp oil, herbs or seasoning'],steps:'Cook rice. Pan-cook chicken until fully cooked, heat the vegetables, then serve together.'},{id:'bean-chilli',name:'Easy bean chilli',time:'25 min',cal:430,pro:22,ingredients:['1 can mixed beans, drained','1 can chopped tomatoes','½ onion (optional)','Chilli powder or paprika','Serve with rice or potato'],steps:'Soften onion if using, add beans, tomatoes and seasoning. Simmer for 15–20 minutes.'},{id:'tuna-potato',name:'Tuna jacket potato',time:'15 min*',cal:490,pro:36,ingredients:['1 medium-large potato','1 small can tuna, drained','2 tbsp plain yoghurt or light mayo','Sweetcorn or salad (optional)'],steps:'Cook the potato until soft. Mix tuna with yoghurt or mayo, split potato and add tuna and vegetables. *Microwave time varies.'},{id:'tofu-noodles',name:'Quick tofu & veg noodles',time:'20 min',cal:520,pro:25,ingredients:['150 g firm tofu','1 portion noodles','2 handfuls mixed vegetables','Soy sauce or other seasoning'],steps:'Cook noodles. Brown cubed tofu, add vegetables and cook until hot. Stir through noodles and seasoning.'}];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function card(s,extra){return '<section class="card '+(extra||'')+'">'+s+'</section>'}
function btn(text,action,extra){return '<button class="btn '+(extra||'')+'" data-action="'+action+'">'+text+'</button>'}
function todayFoods(){return state.foods.filter(function(f){return f.date===dateKey()})}
function activeDates(){var dates={};state.sessions.forEach(function(s){if(s.date)dates[s.date]=true});Object.keys(state.checks).forEach(function(day){if(Object.values(state.checks[day]||{}).some(Boolean))dates[day]=true});return Object.keys(dates).sort()}
function currentStreak(){var dates=activeDates(),set={};dates.forEach(function(d){set[d]=true});var cursor=new Date();if(!set[dateKey(cursor)])cursor.setDate(cursor.getDate()-1);var count=0;while(set[dateKey(cursor)]){count++;cursor.setDate(cursor.getDate()-1)}return count}
function weeklyCount(){var from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-6);return state.sessions.filter(function(s){return new Date(s.date+'T12:00:00')>=from}).length}
function milestones(){var n=state.sessions.length,s=currentStreak();return [{icon:'🏁',title:'First workout',detail:'Complete your first training session',ok:n>=1},{icon:'🔥',title:'3-day streak',detail:'Stay active 3 days in a row',ok:s>=3},{icon:'💪',title:'5 workouts',detail:'Log five training sessions',ok:n>=5},{icon:'⚡',title:'7-day streak',detail:'Stay active 7 days in a row',ok:s>=7},{icon:'🏆',title:'10 workouts',detail:'Log ten training sessions',ok:n>=10},{icon:'🌟',title:'25 workouts',detail:'Log twenty-five training sessions',ok:n>=25},{icon:'👑',title:'14-day streak',detail:'Stay active 14 days in a row',ok:s>=14},{icon:'🥇',title:'50 workouts',detail:'Log fifty training sessions',ok:n>=50}]}
function drawTabs(){var names=[['Today','⌂'],['Train','✣'],['Food','＋'],['Recipes','♨'],['Macros','◎'],['Progress','↗'],['Rewards','★']];tabs.innerHTML=names.map(function(item){return '<button class="'+(state.page===item[0]?'active':'')+'" data-page="'+item[0]+'"><span>'+item[1]+'</span>'+item[0]+'</button>'}).join('')}
function macroPage(){var result=state.macroResult,html='<div class="eyebrow">FREE ON-DEVICE ESTIMATOR</div><div class="hero">YOUR MACROS.<br>YOUR START.</div><div class="sub">A simple estimate from the details you enter—no AI account, API key, or paid service.</div>';
html+=card('<h2>About you</h2><p class="note">For adults 18+. Use your current weight and approximate height. The “equation” setting refers only to the sex-specific coefficient in a common resting-energy formula; choose a range if you prefer.</p><div class="row"><label>Age (years)<input id="macroAge" type="number" min="18" max="100" value="'+esc(state.age)+'" placeholder="Required"></label><label>Weight (kg)<input id="macroWeight" type="number" min="35" max="350" step="0.1" value="'+esc(state.weight)+'"></label></div><div class="row"><label>Height (cm)<input id="macroHeight" type="number" min="120" max="230" value="'+esc(state.height)+'"></label><label>Activity level<select id="macroActivity"><option value="1.2" '+(state.activity==='1.2'?'selected':'')+'>Mostly sitting</option><option value="1.375" '+(state.activity==='1.375'?'selected':'')+'>Light activity</option><option value="1.55" '+(state.activity==='1.55'?'selected':'')+'>Moderate activity</option><option value="1.725" '+(state.activity==='1.725'?'selected':'')+'>Very active</option></select></label></div><label>Equation option<select id="macroEquation"><option value="range" '+(state.equation==='range'?'selected':'')+'>Show a range</option><option value="male" '+(state.equation==='male'?'selected':'')+'>Use male equation</option><option value="female" '+(state.equation==='female'?'selected':'')+'>Use female equation</option></select></label><label>Weight-loss pace<select id="macroPace"><option value="0" '+(state.pace==='0'?'selected':'')+'>Maintenance estimate</option><option value="0.25" '+(state.pace==='0.25'?'selected':'')+'>Gentle (about 0.25 kg/week)</option><option value="0.5" '+(state.pace==='0.5'?'selected':'')+'>Moderate (about 0.5 kg/week)</option></select></label><p class="note">Activity multiplier is an estimate; if unsure, choose the lower option. This tool does not diagnose or prescribe.</p>'+btn('GENERATE ESTIMATE','generate-macros','orange')+'</section>');
if(result){html+=card('<div class="between"><h2>Your rough daily estimate</h2><span class="tag">ESTIMATE · NOT A PRESCRIPTION</span></div><div class="macro-grid"><div class="macro"><span class="label">CALORIES</span><strong>'+result.calories.toLocaleString()+'</strong><span class="note">kcal/day</span></div><div class="macro"><span class="label">PROTEIN</span><strong>'+result.protein+' g</strong><span class="note">per day</span></div><div class="macro"><span class="label">CARBOHYDRATE</span><strong>'+result.carbs+' g</strong><span class="note">per day</span></div><div class="macro"><span class="label">FAT</span><strong>'+result.fat+' g</strong><span class="note">per day</span></div></div><p class="note">Estimated maintenance: '+result.maintenance.toLocaleString()+' kcal/day'+(result.range?' (range from two equation options)':'')+'. Your chosen pace uses a modest estimated adjustment. Real needs vary.</p>'+(result.warning?'<p class="note warn">This estimate may be unusually low compared with your estimated resting needs. Please check with a GP or registered dietitian before using it.</p>':'')+'<p class="note">Protein uses a rough weight-based calculation capped at 160 g; fat is estimated at 30% of calories and carbs fill the remainder. These are practical approximations, not personalised clinical targets.</p>'+btn('USE CALORIE & PROTEIN GOALS IN FOOD','apply-macros','alt'))}
html+='<p class="note">Do not use this estimator if you are under 18, pregnant or breastfeeding, have a history of disordered eating, or need nutrition managed for a medical condition; ask a healthcare professional instead. No personal details leave this device.</p>';return html}
function render(){var foods=todayFoods(),kcal=foods.reduce(function(n,f){return n+(Number(f.cal)||0)},0),protein=foods.reduce(function(n,f){return n+(Number(f.pro)||0)},0),html='';
if(state.page==='Today'){
var checks=state.checks[dateKey()]||{};html='<div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+'</div><div class="hero">BUILD<br>YOURSELF.</div><div class="sub">Lose fat. Build strength. Keep showing up.</div>';
html+=card('<div class="between"><div><div class="eyebrow">TODAY’S MISSION</div><div class="hero">One day stronger.</div><div class="muted">A little progress beats no progress.</div></div><span class="tag">LET’S GO</span></div><div style="margin-top:16px">'+btn('START A WORKOUT','train','orange')+'</div>','hero-card');
html+=card('<div class="between"><div><div class="label">WORKOUTS · LAST 7 DAYS</div><div class="big">'+weeklyCount()+' <span class="muted" style="font-size:16px">sessions</span></div></div><span class="tag">🔥 '+currentStreak()+' DAY STREAK</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,weeklyCount()/4*100)+'%"></div></div><div class="note">A manageable starting goal is 2–4 strength sessions each week.</div>');
html+=card('<div class="between"><div><div class="label">TODAY’S FOOD LOG</div><div class="metric">'+kcal+' <span class="muted" style="font-size:14px">kcal</span></div></div><div style="text-align:right"><div class="label">PROTEIN</div><div class="metric">'+protein+' <span class="muted" style="font-size:14px">g</span></div></div></div><div class="divider"></div>'+btn('LOG FOOD','food','alt'));
html+=card('<div class="label">DAILY DISCIPLINE</div>'+habits.map(function(h,i){return '<label class="habit"><span>'+h+'</span><input class="check" type="checkbox" data-habit="'+i+'" '+(checks[i]?'checked':'')+'></label>'}).join(''));
html+='<p class="note">Your height is set to about 196 cm (6 ft 5 in) and starting weight to 130 kg based on what you shared. Edit your weight in Progress; macro details can be changed in Macros.</p>';
}else if(state.page==='Train'){
var index=Math.max(0,Math.min(plans.length-1,Number(state.plan)||0)),plan=plans[index],prefix=dateKey()+'-'+index;html='<div class="eyebrow">THE WORK</div><div class="hero">NO EXCUSES.<br>JUST REPS.</div><div class="sub">Four-day upper/lower plan · move with control · leave a few good reps in reserve.</div><div class="pills">'+plans.map(function(p,i){return '<button class="pill '+(i===index?'sel':'')+'" data-plan="'+i+'">'+p.name+'</button>'}).join('')+'</div>';
html+=card('<div class="label">TODAY’S SESSION</div><h2 style="font-size:24px;margin-top:7px">'+plan.name+'</h2><div class="tag">'+plan.focus+'</div>'+plan.moves.map(function(move,i){var key=prefix+'-'+i;return '<div class="exercise"><div><strong class="'+(state.done[key]?'done':'')+'">'+move[0]+'</strong><small>'+move[1]+'</small></div><button class="btn alt" data-exercise="'+i+'" data-prefix="'+prefix+'">'+(state.done[key]?'DONE ✓':'CHECK')+'</button></div>'}).join('')+'<div style="margin-top:16px">'+btn('FINISH WORKOUT','finish')+'</div>');html+='<p class="note">Start with comfortable loads and good technique. Stop if you feel sharp or worsening pain. Ask a qualified trainer for help if unsure about form.</p>';
}else if(state.page==='Food'){
var shortcuts=starterShortcuts.concat(state.shortcuts);html='<div class="eyebrow">FUEL THE WORK</div><div class="hero">EAT WELL.<br>GET STRONG.</div><div class="sub">Log food without judgement. Keep it simple and sustainable.</div>';
html+=card('<h2>Quick meal shortcuts</h2><p class="note">Tap a meal to add its estimated nutrition to today’s log. Estimates vary by portion and ingredients.</p>'+shortcuts.map(function(s){return '<div class="shortcut"><div class="between"><div><strong>'+esc(s.name)+'</strong><small>'+s.cal+' kcal · '+s.pro+' g protein</small></div><button class="btn small-btn" data-shortcut="'+esc(s.id)+'">ADD</button></div></div>'}).join(''));
html+=card('<h2>Optional daily goals</h2><p class="note">Targets are optional estimates, not medical advice. Set them in Macros if you want help generating a starting point.</p><div class="row"><div class="macro"><span class="label">CALORIES</span><strong>'+(state.calorieGoal||'Not set')+'</strong></div><div class="macro"><span class="label">PROTEIN</span><strong>'+(state.proteinGoal?state.proteinGoal+' g':'Not set')+'</strong></div></div><button class="btn alt" data-page="Macros">OPEN MACRO ESTIMATOR</button>');
html+=card('<h2>Log a meal</h2><input id="foodName" placeholder="Food or meal name" maxlength="80"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>'+btn('ADD TO TODAY','add-food'));
html+=card('<div class="between"><h2>Today’s log</h2><span class="tag">'+foods.length+' ITEMS</span></div>'+(foods.length?foods.map(function(f){return '<div class="entry"><span><strong>'+esc(f.name)+'</strong><small>'+f.cal+' kcal · '+f.pro+' g protein</small></span><div><button class="btn alt small-btn" data-save-shortcut="'+esc(f.id)+'">SAVE</button> <button class="btn red small-btn" data-remove="'+esc(f.id)+'">×</button></div></div>'}).join(''):'<div class="empty">Nothing logged yet. Add a meal above.</div>')+'<div class="divider"></div><strong>TOTAL: '+kcal+' kcal · '+protein+' g protein</strong>');
}else if(state.page==='Recipes'){
var recipes=[{id:'chicken-rice',name:'Chicken, rice & veg bowl',time:'25 min',cal:560,pro:43,ingredients:['150 g chicken breast','75 g dry rice','Frozen vegetables','Seasoning'],steps:'Cook rice. Pan-cook chicken thoroughly, heat vegetables, then serve together.'},{id:'bean-chilli',name:'Easy bean chilli',time:'25 min',cal:430,pro:22,ingredients:['1 can mixed beans','1 can chopped tomatoes','Chilli powder or paprika','Rice or potato'],steps:'Add beans, tomatoes and seasoning to a pan. Simmer 15–20 minutes and serve.'},{id:'tuna-potato',name:'Tuna jacket potato',time:'15 min*',cal:490,pro:36,ingredients:['1 medium-large potato','1 small can tuna','Plain yoghurt or light mayo','Sweetcorn or salad'],steps:'Cook potato until soft. Mix tuna with yoghurt or mayo, split potato and add toppings. *Microwave time varies.'},{id:'tofu-noodles',name:'Quick tofu & veg noodles',time:'20 min',cal:520,pro:25,ingredients:['150 g firm tofu','Noodles','Mixed vegetables','Soy sauce'],steps:'Cook noodles. Brown tofu, add vegetables and cook until hot. Stir through noodles and seasoning.'}];
html='<div class="eyebrow">SIMPLE FOOD IDEAS</div><div class="hero">RECIPES THAT<br>FUEL YOU.</div><div class="sub">Affordable meal ideas. Nutrition is estimated per serving; ingredients and portions change the numbers.</div>'+recipes.map(function(r){return card('<div class="between"><h2>'+r.name+'</h2><span class="tag">'+r.time+'</span></div><div class="muted">Approx. '+r.cal+' kcal · '+r.pro+' g protein / serving</div><div class="divider"></div><strong>Ingredients</strong><ul>'+r.ingredients.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p class="muted">'+esc(r.steps)+'</p>'+btn('ADD TO FOOD LOG','recipe:'+r.id,'alt')}).join('')+'<p class="note">Follow food-safety guidance and adjust ingredients for allergies or dietary needs.</p>';
}else if(state.page==='Macros'){html=macroPage()}
else if(state.page==='Progress'){
html='<div class="eyebrow">PROOF OF YOUR WORK</div><div class="hero">TRACK THE<br>COMEBACK.</div><div class="sub">The goal is progress—not perfection. Strength, energy and habits count too.</div>';
html+=card('<h2>Weight check-in</h2><p class="muted">Record your weight in kilograms.</p><div class="row"><input id="weightInput" type="number" min="1" max="500" step="0.1" value="'+esc(state.weight)+'" placeholder="Weight in kg"><button class="btn" data-action="save-weight">SAVE</button></div><div class="grid"><div class="stat"><div class="label">LATEST</div><strong>'+esc(state.weight)+' kg</strong></div><div class="stat"><div class="label">CHECK-INS</div><strong>'+state.weights.length+'</strong></div></div><p class="note">For a useful trend, weigh under similar conditions and focus on longer-term changes.</p>');
html+=card('<h2>Weight history</h2>'+(state.weights.length?state.weights.slice().reverse().slice(0,12).map(function(w){return '<div class="entry"><span>'+new Date(w.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</span><strong>'+esc(w.kg)+' kg</strong></div>'}).join(''):'<div class="empty">Your check-ins will appear here.</div>'));

var count=state.sessions.length,streak=currentStreak(),badges=milestones(),earned=badges.filter(function(b){return b.ok}).length;html='<div class="eyebrow">CONSISTENCY BUILDS RESULTS</div><div class="hero">STACK YOUR<br>WINS.</div><div class="sub">Celebrate your work. Active days include a workout or a checked daily habit.</div>';

function generateMacros(){var age=Number(document.getElementById('macroAge').value),weight=Number(document.getElementById('macroWeight').value),height=Number(document.getElementById('macroHeight').value),activity=Number(document.getElementById('macroActivity').value),equation=document.getElementById('macroEquation').value,pace=Number(document.getElementById('macroPace').value);if(!Number.isFinite(age)||age<18||age>100){alert('This estimator is for adults 18+. Enter an age from 18 to 100.');return}if(!Number.isFinite(weight)||weight<35||weight>350||!Number.isFinite(height)||height<120||height>230){alert('Enter a valid height and weight.');return}state.age=String(age);state.weight=String(weight);state.height=String(height);state.activity=String(activity);state.equation=equation;state.pace=String(pace);var base=10*weight+6.25*height-5*age,rest;if(equation==='male')rest=[base+5];else if(equation==='female')rest=[base-161];else rest=[base-161,base+5];var maintenanceValues=rest.map(function(r){return r*activity}),maintenance=maintenanceValues.reduce(function(a,b){return a+b},0)/maintenanceValues.length,deficit=Math.min(pace*7700/7,maintenance*.2),target=Math.round((maintenance-deficit)/50)*50,protein=Math.min(160,Math.round(weight*1.6)),fat=Math.round(target*.30/9),carbs=Math.max(0,Math.round((target-protein*4-fat*9)/4));state.calorieGoal=String(target);state.proteinGoal=String(protein);state.macroResult={calories:target,protein:protein,fat:fat,carbs:carbs,maintenance:Math.round(maintenance/50)*50,range:equation==='range',warning:target<Math.min.apply(null,rest)};save();render()}
document.addEventListener('click',function(event){var el=event.target.closest('button');if(!el)return;if(el.dataset.page){state.page=el.dataset.page;save();render();return}if(el.dataset.plan!==undefined){state.plan=Number(el.dataset.plan);save();render();return}if(el.dataset.exercise!==undefined){var key=el.dataset.prefix+'-'+el.dataset.exercise;state.done[key]=!state.done[key];save();render();return}if(el.dataset.remove){state.foods=state.foods.filter(function(f){return String(f.id)!==el.dataset.remove});save();render();return}if(el.dataset.shortcut){var shortcut=starterShortcuts.find(function(s){return s.id===el.dataset.shortcut})||state.shortcuts.find(function(s){return s.id===el.dataset.shortcut});if(shortcut){state.foods.push({id:String(Date.now()),name:shortcut.name,cal:Number(shortcut.cal),pro:Number(shortcut.pro),date:dateKey()});save();render()}return}if(el.dataset.saveShortcut){var food=state.foods.find(function(f){return String(f.id)===el.dataset.saveShortcut});if(food&&!state.shortcuts.some(function(s){return s.name.toLowerCase()===food.name.toLowerCase()})){state.shortcuts.push({id:'custom-'+Date.now(),name:food.name,cal:Number(food.cal)||0,pro:Number(food.pro)||0});save();alert('Saved as a meal shortcut!')}else if(food){alert('That meal is already saved as a shortcut.')}return}var action=el.dataset.action;if(!action)return;if(action==='train'||action==='food'){state.page=action==='train'?'Train':'Food';save();render();return}if(action==='generate-macros'){generateMacros();return}if(action==='apply-macros'){state.page='Food';save();render();return}if(action.indexOf('recipe:')===0){var recipeId=action.slice(7),recipeList=[{id:'chicken-rice',name:'Chicken, rice & veg bowl',cal:560,pro:43},{id:'bean-chilli',name:'Easy bean chilli',cal:430,pro:22},{id:'tuna-potato',name:'Tuna jacket potato',cal:490,pro:36},{id:'tofu-noodles',name:'Quick tofu & veg noodles',cal:520,pro:25}],recipe=recipeList.find(function(r){return r.id===recipeId});if(recipe){state.foods.push({id:String(Date.now()),name:recipe.name,cal:recipe.cal,pro:recipe.pro,date:dateKey()});state.page='Food';save();render()}return}if(action==='finish'){var p=plans[state.plan]||plans[0];state.sessions.push({name:p.name,date:dateKey()});save();render();alert('Workout saved. You showed up—that’s a win.');return}if(action==='add-food'){var name=document.getElementById('foodName').value.trim(),cal=Number(document.getElementById('foodCal').value),pro=Number(document.getElementById('foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(pro)||cal<0||pro<0){alert('Enter a food name and valid calorie and protein numbers.');return}state.foods.push({id:String(Date.now()),name:name,cal:cal,pro:pro,date:dateKey()});save();render();return}if(action==='save-weight'){var kg=Number(document.getElementById('weightInput').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}state.weight=Math.round(kg*10)/10;state.weights.push({kg:state.weight,date:dateKey()});save();render()}});
