<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101510"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ForgeFit"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>ForgeFit — Stronger every day</title>
<style>
:root{color-scheme:dark;--bg:#101510;--panel:#1a241d;--line:#304035;--lime:#b8f36b;--text:#f4f6f1;--muted:#a9b5a8;--soft:#263329;--danger:#ffad9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:2;height:60px;background:#101510ed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:950;letter-spacing:2px}.brand span,.eyebrow{color:var(--lime)}.small,.muted,.note{color:var(--muted)}.small{font-size:10px;letter-spacing:1.4px}main{max-width:680px;margin:auto;padding:20px 18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px}.hero{font-size:38px;line-height:1.04;font-weight:950;letter-spacing:-1.3px;margin:12px 0}.sub{color:var(--muted);line-height:1.55}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}.label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1.5px}.between,.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.row>*{flex:1}.metric{font-size:26px;font-weight:950}.big{font-size:34px;font-weight:950}.track{height:8px;background:var(--soft);border-radius:10px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--lime);border-radius:10px}.btn{border:0;border-radius:12px;background:var(--lime);color:#15200f;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer}.btn.alt{background:var(--soft);color:var(--text)}.btn.red{background:#402b28;color:var(--danger)}input,textarea{width:100%;background:#111912;color:var(--text);border:1px solid #405045;border-radius:11px;padding:12px;margin:6px 0;font:inherit}input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0}.tabs{position:fixed;z-index:3;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#151d17;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:var(--muted);font:700 11px -apple-system,BlinkMacSystemFont,sans-serif;min-width:55px;padding:5px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:19px;margin-bottom:3px}.pills{display:flex;gap:8px;overflow:auto;margin:16px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 13px;border-radius:11px;font-weight:800}.pill.sel{background:var(--lime);color:#15200f}.exercise,.entry,.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.exercise .btn{padding:9px 10px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px;line-height:1.55}.quote{font-size:22px;font-weight:850;line-height:1.4}.tag{color:var(--lime);font-size:11px;font-weight:900}.check{width:20px;height:20px;accent-color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#111912;padding:13px;border-radius:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}h2{font-size:19px;margin:2px 0 8px}p{line-height:1.55} @media(min-width:650px){main{padding-top:28px}.hero{font-size:44px}}
</style></head>
<body><header><div class="brand">FORGE<span>FIT</span></div><div class="small">YOUR FITNESS COMPANION</div></header><main id="app"></main><nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='forgefit-data-v1';
const dateKey=()=>{let x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const base={tab:'Today',day:0,weight:130,foods:[],weights:[],sessions:[],checks:{},exerciseDone:{},calorieGoal:'',proteinGoal:''};let data;try{data={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...base}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(s){return `<section class="card">${s}</section>`}function button(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}
function field(k,ph,type='text'){return `<input type="${type}" placeholder="${ph}" value="${esc(data[k]??'')}" oninput="data.${k}=this.value;save()">`}
const plans=[['Upper A','Chest, back, shoulders & arms',[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]],['Lower A','Quads, hamstrings & core',[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]],['Upper B','Back, chest, delts & arms',[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]],['Lower B','Glutes, hamstrings & core',[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]]];
const habits=['Do some planned movement','Eat a protein-rich food','Have fruit or vegetables','Make time for good sleep'];const cheer=['A small win still counts. Show up for the next step.','You do not need a perfect day—just a helpful next choice.','Strength is built by coming back, one session at a time.','Rest is part of progress. Be proud of your effort.','The scale is one number, not the whole story. Keep building habits.','You are working toward strength and better health. Keep going.','Consistency beats an all-or-nothing plan.'];
function go(t){data.tab=t;save();render()}function todayFoods(){return data.foods.filter(f=>f.date===dateKey())}function weekCount(){let from=new Date();from.setDate(from.getDate()-6);return data.sessions.filter(s=>new Date(s.date+'T12:00:00')>=from).length}
function renderTabs(){let a=[['Today','⌂'],['Train','✣'],['Food','＋'],['Progress','↗'],['Motivate','✧']];$('#tabs').innerHTML=a.map(([n,i])=>`<button class="${data.tab===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}
function render(){let foods=todayFoods(),kcal=foods.reduce((n,f)=>n+f.cal,0),protein=foods.reduce((n,f)=>n+f.pro,0),out='';
if(data.tab==='Today')out=`<div class="eyebrow">A FRESH START, EVERY DAY</div><div class="hero">Get stronger.<br>Feel better.</div><div class="sub">Build strength, work toward losing weight, and celebrate the small wins. No perfection needed.</div>${card(`<div class="label">TODAY’S FOOD LOG</div><div class="between"><span class="metric">${kcal} kcal</span><span class="muted">${data.calorieGoal?`of ${esc(data.calorieGoal)} kcal`:'log as you go'}</span></div>${data.calorieGoal?`<div class="track"><div class="fill" style="width:${Math.min(100,kcal/Number(data.calorieGoal)*100)}%"></div></div>`:''}<div class="between"><span class="muted">Protein</span><span>${protein} g${data.proteinGoal?` / ${esc(data.proteinGoal)} g`:''}</span></div><p class="note">Targets are optional. The app does not guess your calorie needs.</p>${button('Add food',"go('Food')`)}`)}${card(`<div class="label">WORKOUTS IN THE LAST 7 DAYS</div><div class="big">${weekCount()} <span class="muted" style="font-size:17px">sessions</span></div><p class="muted">A manageable start can be 2–4 strength sessions each week. Rest days count too.</p>${button('Choose a workout',"go('Train')`)}`)}${card(`<div class="label">TODAY’S SMALL WINS</div>${habits.map((h,i)=>`<label class="habit"><span>${h}</span><input class="check" type="checkbox" ${data.checks[dateKey()]?.[i]?'checked':''} onchange="habit(${i},this.checked)"></label>`).join('')}`)}<p class="note">Your height is 6 ft 5 in. You said you weigh about 20–21 stone (roughly 127–133 kg); update your actual weight in Progress.</p>`;
if(data.tab==='Train'){let p=plans[data.day],key=dateKey()+':'+data.day;out=`<div class="eyebrow">STRENGTH PLAN</div><div class="hero">Train at your pace.</div><div class="sub">Four simple gym sessions. Choose comfortable weights and focus on good form.</div><div class="pills">${plans.map((x,i)=>`<button class="pill ${i===data.day?'sel':''}" onclick="data.day=${i};save();render()">${x[0]}</button>`).join('')}</div>${card(`<h2>${p[0]}</h2><div class="muted">${p[1]}</div>${p[2].map(([n,r],i)=>`<div class="exercise"><div><span class="${data.exerciseDone[key+':'+i]?'done':''}">${n}</span><small>${r}</small></div><button class="btn alt" onclick="exercise('${key}',${i})">${data.exerciseDone[key+':'+i]?'Done ✓':'Mark done'}</button></div>`).join('')}<p>${button('Finish workout',`finish('${p[0]}')`)}</p>`)}<p class="note">Start light and leave a few good reps in reserve. Stop if you feel sharp or worsening pain. Ask a qualified trainer for help with technique when needed.</p>`}
if(data.tab==='Food')out=`<div class="eyebrow">FOOD & FUEL</div><div class="hero">Fuel your progress.</div><div class="sub">Log food without judging yourself. Realistic habits are easier to keep.</div>${card(`<h2>Optional daily targets</h2><p class="note">Targets depend on individual needs; these are not medical advice. Leave blank if you are unsure.</p><div class="row"><label>Calories (kcal)${field('calorieGoal','Leave blank or enter goal','number')}</label><label>Protein (g)${field('proteinGoal','Leave blank or enter goal','number')}</label></div>`)}${card(`<h2>Add food</h2><input id="foodName" placeholder="Food or meal name"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>${button('Add to today','addFood()')}`)}${card(`<h2>Today’s food</h2>${foods.length?foods.map(f=>`<div class="entry"><span>${esc(f.name)}<small>${f.cal} kcal · ${f.pro} g protein</small></span><button class="btn red" onclick="removeFood('${f.id}')">Remove</button></div>`).join(''):'<div class="empty">Nothing logged yet. Add something above when you’re ready.</div>'}<p><strong>Total: ${kcal} kcal · ${protein} g protein</strong></p>`)}${card('<h2>Simple staples</h2><p class="muted">Eggs · beans · yoghurt · chicken · tofu · oats · potatoes · rice · frozen vegetables · fruit. Pick foods you enjoy and can afford.</p>')}`;
if(data.tab==='Progress')out=`<div class="eyebrow">PROGRESS THAT COUNTS</div><div class="hero">Notice your wins.</div><div class="sub">Weight is only one measure. Strength, energy, sleep, and consistency count too.</div>${card(`<h2>Weight check-in</h2><p class="muted">Record your weight in kilograms.</p><div class="row">${field('weight','Weight in kg','number')}<button class="btn" onclick="saveWeight()">Save</button></div><div class="grid"><div class="stat"><span class="label">CURRENT</span><strong>${esc(data.weight)} kg</strong></div><div class="stat"><span class="label">CHECK-INS</span><strong>${data.weights.length}</strong></div></div><p class="note">If you weigh yourself, use similar conditions and look at the longer-term trend rather than daily changes.</p>`)}${card(`<h2>Weight history</h2>${data.weights.length?data.weights.slice().reverse().slice(0,12).map(w=>`<div class="entry"><span>${new Date(w.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span><strong>${w.kg} kg</strong></div>`).join(''):'<div class="empty">Your check-ins will appear here.</div>'}`)}<p class="note">For personal health or nutrition advice, especially if you have a health condition, pain, or take medication, speak with your GP or a registered dietitian.</p>`;
if(data.tab==='Motivate'){let index=Math.floor(Date.now()/86400000)%cheer.length;out=`<div class="eyebrow">A NOTE FOR TODAY</div><div class="hero">Keep showing up.</div>${card(`<div class="label">YOUR REMINDER</div><p class="quote">“${cheer[index]}”</p><p class="muted">You’re building strength while working toward better health. Sustainable progress takes time.</p>`)}${card(`<h2>Remember</h2><div class="habit">✓ <span>One workout is a win, even if it is short.</span></div><div class="habit">✓ <span>A missed day does not erase your progress.</span></div><div class="habit">✓ <span>Track strength and habits, not only the scale.</span></div><div class="habit">✓ <span>Rest helps you get stronger.</span></div>`)}${card(`<h2>Recent workouts</h2>${data.sessions.length?data.sessions.slice(-5).reverse().map(s=>`<div class="entry"><span>${esc(s.name)}</span><small>${new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div>`).join(''):'<div class="empty">Your first session is waiting in Train. Start when you feel ready.</div>'}`)}<p class="note">ForgeFit is a simple tracker, not a medical service or AI coach. Your information stays on this device.</p>`;
$('#app').innerHTML=out;renderTabs()}
function habit(i,v){data.checks[dateKey()]={...(data.checks[dateKey()]||{}),[i]:v};save()}
function exercise(key,i){data.exerciseDone[key+':'+i]=!data.exerciseDone[key+':'+i];save();render()}
function finish(name){data.sessions.push({name,date:dateKey()});save();render();alert('Workout saved. Nice work showing up!')}
function addFood(){let name=$('#foodName').value.trim(),cal=Number($('#foodCal').value),pro=Number($('#foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(pro)||cal<0||pro<0){alert('Enter a food name and valid calorie and protein numbers.');return}data.foods.push({id:String(Date.now()),name,cal,pro,date:dateKey()});save();render()}
function removeFood(id){data.foods=data.foods.filter(x=>x.id!==id);save();render()}
function saveWeight(){let kg=Number(data.weight);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}data.weight=Math.round(kg*10)/10;data.weights.push({kg:data.weight,date:dateKey()});save();render()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
