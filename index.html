<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ForgedFitness">
<link rel="manifest" href="manifest.webmanifest">
<title>ForgedFitness — Train with purpose</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#34363d;--lime:#c5ff42;--orange:#ff8747;--text:#f6f7f3;--muted:#a1a4ad;--soft:#24262c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}header{height:60px;padding:0 18px;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#101114;border-bottom:1px solid var(--line)}.brand{font-weight:950;font-style:italic;letter-spacing:.5px;font-size:17px}.brand span,.eyebrow{color:var(--lime)}.small{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}main{max-width:680px;margin:auto;padding:20px 17px}.eyebrow,.label{font-size:10px;font-weight:900;letter-spacing:1.6px}.hero{font-size:38px;line-height:1.03;font-weight:950;font-style:italic;margin:12px 0}.sub,.muted,.note{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#202228,#191a1f);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero-card{background:linear-gradient(135deg,#c5ff42,#8cce1e);color:#14170e;border:0}.hero-card .eyebrow,.hero-card .muted{color:#2c3c16}.hero-card .hero{font-size:28px}.label{color:var(--muted)}.row,.between{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.row>*{flex:1}.metric{font-size:25px;font-weight:950}.big{font-size:34px;font-weight:950}.btn{border:0;border-radius:11px;background:var(--lime);color:#15190e;padding:12px 14px;font:inherit;font-weight:900;cursor:pointer}.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}.btn.orange{background:var(--orange);color:#21140d}.btn.red{background:#402b28;color:#ff9e92}input{width:100%;background:#131419;color:var(--text);border:1px solid #44464d;border-radius:10px;padding:12px;margin:6px 0;font:inherit}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:space-around;background:#191a1f;border-top:1px solid var(--line);padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;min-width:52px;padding:5px}.tabs button.active{color:var(--lime)}.tabs span{display:block;font-size:18px;margin-bottom:3px}.pills{display:flex;gap:7px;overflow:auto;margin:15px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:800}.pill.sel{background:var(--lime);color:#15190e}.exercise,.entry,.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px}.tag{display:inline-block;background:#303522;color:var(--lime);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900}.check{width:20px;height:20px;accent-color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#141519;padding:13px;border-radius:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}.track{height:8px;background:#3a3b40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}h2{font-size:19px;margin:2px 0 8px}.quote{font-size:21px;font-weight:900;font-style:italic;line-height:1.4}@media(min-width:650px){main{padding-top:28px}}
</style>
</head>
<body>
<header><div class="brand">FORGED<span>FITNESS</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app"><section class="card"><strong>Loading ForgedFitness…</strong><p class="muted">Your training dashboard will appear in a moment.</p></section></main>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),tabs=document.getElementById('tabs'),storageKey='forgedfitness-v2';
function dateKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var defaults={page:'Today',plan:0,weight:'130',foods:[],weights:[],sessions:[],checks:{},done:{},calorieGoal:'',proteinGoal:''},state;
try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){state=Object.assign({},defaults)}
var plans=[
 {name:'Upper A',focus:'CHEST · BACK · SHOULDERS',moves:[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]},
 {name:'Lower A',focus:'QUADS · HAMSTRINGS · CORE',moves:[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]},
 {name:'Upper B',focus:'BACK · CHEST · ARMS',moves:[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]},
 {name:'Lower B',focus:'GLUTES · HAMSTRINGS · CORE',moves:[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]}
];
var habits=['Get some planned movement','Eat a protein-rich food','Have fruit or vegetables','Make time for good sleep'];
var quotes=['Show up. Put in the work. Get a little stronger.','You do not need a perfect day. Just make the next good choice.','Strength is built one rep—and one return to the gym—at a time.','The scale is one stat. Your effort is the real score.','Rest is training too. Recover, then come back ready.','Small wins stack up. Keep building.'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function card(s,extra){return '<section class="card '+(extra||'')+'">'+s+'</section>'}
function btn(text,action,extra){return '<button class="btn '+(extra||'')+'" data-action="'+action+'">'+text+'</button>'}
function todayFoods(){return state.foods.filter(function(f){return f.date===dateKey()})}
function weeklyCount(){var from=new Date();from.setDate(from.getDate()-6);return state.sessions.filter(function(s){return new Date(s.date+'T12:00:00')>=from}).length}
function drawTabs(){var names=[['Today','⌂'],['Train','✣'],['Food','＋'],['Progress','↗'],['Mindset','⚡']];tabs.innerHTML=names.map(function(item){return '<button class="'+(state.page===item[0]?'active':'')+'" data-page="'+item[0]+'"><span>'+item[1]+'</span>'+item[0]+'</button>'}).join('')}
function render(){var foods=todayFoods(),kcal=foods.reduce(function(n,f){return n+f.cal},0),protein=foods.reduce(function(n,f){return n+f.pro},0),html='';
if(state.page==='Today'){
 html='<div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+'</div><div class="hero">BUILD<br>YOURSELF.</div><div class="sub">Lose fat. Build strength. Keep showing up.</div>';
 html+=card('<div class="between"><div><div class="eyebrow">TODAY’S MISSION</div><div class="hero">One day stronger.</div><div class="muted">A little progress beats no progress.</div></div><span class="tag">LET’S GO</span></div><div style="margin-top:16px">'+btn('START A WORKOUT','train','orange')+'</div>','hero-card');
 html+=card('<div class="between"><div><div class="label">WORKOUTS · LAST 7 DAYS</div><div class="big">'+weeklyCount()+' <span class="muted" style="font-size:16px">sessions</span></div></div><span class="tag">KEEP GOING</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,weeklyCount()/4*100)+'%"></div></div><div class="note">A manageable starting goal is 2–4 strength sessions each week.</div>');
 html+=card('<div class="between"><div><div class="label">TODAY’S FOOD LOG</div><div class="metric">'+kcal+' <span class="muted" style="font-size:14px">kcal</span></div></div><div style="text-align:right"><div class="label">PROTEIN</div><div class="metric">'+protein+' <span class="muted" style="font-size:14px">g</span></div></div></div><div class="divider"></div>'+btn('LOG FOOD','food','alt'));
 html+=card('<div class="label">DAILY DISCIPLINE</div>'+habits.map(function(h,i){return '<label class="habit"><span>'+h+'</span><input class="check" type="checkbox" data-habit="'+i+'" '+(state.checks[dateKey()]&&state.checks[dateKey()][i]?'checked':'')+'></label>'}).join(''));
 html+='<p class="note">You said you’re 6 ft 5 in and around 20–21 stone (about 127–133 kg). Update your actual weight in Progress. Targets are left blank rather than guessed.</p>';
}else if(state.page==='Train'){
 var index=Math.max(0,Math.min(plans.length-1,Number(state.plan)||0)),plan=plans[index],prefix=dateKey()+'-'+index;
 html='<div class="eyebrow">THE WORK</div><div class="hero">NO EXCUSES.<br>JUST REPS.</div><div class="sub">Four-day upper/lower plan · move with control · leave a few good reps in reserve.</div><div class="pills">'+plans.map(function(p,i){return '<button class="pill '+(i===index?'sel':'')+'" data-plan="'+i+'">'+p.name+'</button>'}).join('')+'</div>';
 html+=card('<div class="label">TODAY’S SESSION</div><h2 style="font-size:24px;margin-top:7px">'+plan.name+'</h2><div class="tag">'+plan.focus+'</div>'+plan.moves.map(function(move,i){var key=prefix+'-'+i;return '<div class="exercise"><div><strong class="'+(state.done[key]?'done':'')+'">'+move[0]+'</strong><small>'+move[1]+'</small></div><button class="btn alt" data-exercise="'+i+'" data-prefix="'+prefix+'">'+(state.done[key]?'DONE ✓':'CHECK')+'</button></div>'}).join('')+'<div style="margin-top:16px">'+btn('FINISH WORKOUT','finish')+'</div>');
 html+='<p class="note">Start with comfortable loads and good technique. Stop if you feel sharp or worsening pain. Ask a qualified trainer for help if unsure about form.</p>';
}else if(state.page==='Food'){
 html='<div class="eyebrow">FUEL THE WORK</div><div class="hero">EAT WELL.<br>GET STRONG.</div><div class="sub">Log food without judgement. Keep it simple and sustainable.</div>';
 html+=card('<h2>Optional daily goals</h2><p class="note">Calories and protein needs vary. These goals are optional, not medical advice. Leave blank if you have not chosen a target with a qualified professional.</p><div class="row"><label>Calories (kcal)<input type="number" min="0" data-field="calorieGoal" value="'+esc(state.calorieGoal)+'" placeholder="Leave blank"></label><label>Protein (g)<input type="number" min="0" data-field="proteinGoal" value="'+esc(state.proteinGoal)+'" placeholder="Leave blank"></label></div>');
 html+=card('<h2>Log a meal</h2><input id="foodName" placeholder="Food or meal name" maxlength="80"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>'+btn('ADD TO TODAY','add-food'));
 html+=card('<div class="between"><h2>Today’s log</h2><span class="tag">'+foods.length+' ITEMS</span></div>'+(foods.length?foods.map(function(f){return '<div class="entry"><span><strong>'+esc(f.name)+'</strong><small>'+f.cal+' kcal · '+f.pro+' g protein</small></span><button class="btn red" data-remove="'+esc(f.id)+'">REMOVE</button></div>'}).join(''):'<div class="empty">Nothing logged yet. Add a meal above.</div>')+'<div class="divider"></div><strong>TOTAL: '+kcal+' kcal · '+protein+' g protein</strong>');
 html+=card('<h2>Go-to staples</h2><p class="muted">Eggs · beans · yoghurt · chicken · tofu · oats · potatoes · rice · frozen vegetables · fruit. Pick what you like and can afford.</p>');
}else if(state.page==='Progress'){
 html='<div class="eyebrow">PROOF OF YOUR WORK</div><div class="hero">TRACK THE<br>COMEBACK.</div><div class="sub">The goal is progress—not perfection. Strength, energy and habits count too.</div>';
 html+=card('<h2>Weight check-in</h2><p class="muted">Record your weight in kilograms.</p><div class="row"><input id="weightInput" type="number" min="1" max="500" step="0.1" value="'+esc(state.weight)+'" placeholder="Weight in kg"><button class="btn" data-action="save-weight">SAVE</button></div><div class="grid"><div class="stat"><div class="label">LATEST</div><strong>'+esc(state.weight)+' kg</strong></div><div class="stat"><div class="label">CHECK-INS</div><strong>'+state.weights.length+'</strong></div></div><p class="note">For a useful trend, weigh under similar conditions and focus on longer-term changes.</p>');
 html+=card('<h2>Weight history</h2>'+(state.weights.length?state.weights.slice().reverse().slice(0,12).map(function(w){return '<div class="entry"><span>'+new Date(w.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</span><strong>'+esc(w.kg)+' kg</strong></div>'}).join(''):'<div class="empty">Your check-ins will appear here.</div>'));
 html+=card('<div class="label">WEEKLY TRAINING</div><div class="big">'+weeklyCount()+' <span class="muted" style="font-size:16px">sessions this week</span></div><p class="note">2–4 sessions can be a reasonable place to start. Adjust for your fitness and recovery.</p>');
 html+='<p class="note">For personal health or nutrition advice—especially if you have pain, a health condition, or take medication—ask your GP or a registered dietitian.</p>';
}else{
 var quote=quotes[Math.floor(Date.now()/86400000)%quotes.length];html='<div class="eyebrow">MENTAL GAME</div><div class="hero">STAY IN<br>THE FIGHT.</div>';
 html+=card('<div class="label">TODAY’S REMINDER</div><p class="quote">“'+quote+'”</p><p class="muted">You’re building a stronger body and better habits. It takes time—and you’re allowed to start small.</p>');
 html+=card('<h2>Keep perspective</h2><div class="habit">✦ <span>A short workout still counts.</span></div><div class="habit">✦ <span>One missed day does not undo your effort.</span></div><div class="habit">✦ <span>Track strength and consistency, not only the scale.</span></div><div class="habit">✦ <span>Recovery is part of the plan.</span></div>');
 html+=card('<h2>Recent sessions</h2>'+(state.sessions.length?state.sessions.slice(-5).reverse().map(function(s){return '<div class="entry"><strong>'+esc(s.name)+'</strong><small>'+new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</small></div>'}).join(''):'<div class="empty">Your first session is waiting in Train. Start when you’re ready.</div>'));
 html+='<p class="note">ForgedFitness is a simple personal tracker, not a medical service or AI coach. Your data stays in this browser on this device.</p>';
}
app.innerHTML=html;drawTabs();}
function showError(error){console.error(error);app.innerHTML='<section class="card"><h2>ForgedFitness could not load</h2><p class="muted">Please refresh this page. If it stays blank, close the tab and reopen the website.</p></section>'}
document.addEventListener('click',function(event){var el=event.target.closest('button');if(!el)return;
 if(el.dataset.page){state.page=el.dataset.page;save();render();return}
 if(el.dataset.plan!==undefined){state.plan=Number(el.dataset.plan);save();render();return}
 if(el.dataset.exercise!==undefined){var key=el.dataset.prefix+'-'+el.dataset.exercise;state.done[key]=!state.done[key];save();render();return}
 if(el.dataset.remove){state.foods=state.foods.filter(function(f){return f.id!==el.dataset.remove});save();render();return}
 var action=el.dataset.action;if(action==='train'||action==='food'){state.page=action==='train'?'Train':'Food';save();render()}else if(action==='finish'){var p=plans[state.plan]||plans[0];state.sessions.push({name:p.name,date:dateKey()});save();render();alert('Workout saved. You showed up—that’s a win.')}else if(action==='add-food'){var name=document.getElementById('foodName').value.trim(),cal=Number(document.getElementById('foodCal').value),pro=Number(document.getElementById('foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(pro)||cal<0||pro<0){alert('Enter a food name and valid calorie and protein numbers.');return}state.foods.push({id:String(Date.now()),name:name,cal:cal,pro:pro,date:dateKey()});save();render()}else if(action==='save-weight'){var kg=Number(document.getElementById('weightInput').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}state.weight=Math.round(kg*10)/10;state.weights.push({kg:state.weight,date:dateKey()});save();render()}
});
document.addEventListener('change',function(event){var el=event.target;if(el.dataset.habit!==undefined){var i=el.dataset.habit;state.checks[dateKey()]=state.checks[dateKey()]||{};state.checks[dateKey()][i]=el.checked;save()}if(el.dataset.field){state[el.dataset.field]=el.value;save()}});
try{render()}catch(error){showError(error)}
})();
</script>
</body>
</html>
