<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>ForgedFitness</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#34363d;--lime:#c5ff42;--orange:#ff8747;--text:#f6f7f3;--muted:#a1a4ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:78px}header{padding:18px;border-bottom:1px solid var(--line);font-weight:900;font-style:italic;letter-spacing:1px}header b{color:var(--lime)}main{max-width:680px;margin:auto;padding:18px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#191a1f;border-top:1px solid var(--line);display:flex;overflow:auto;padding:7px}.tabs button{flex:1;min-width:55px;background:none;border:0;color:var(--muted);padding:8px 3px;font-weight:700}.tabs .on{color:var(--lime)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.eyebrow,.label{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:1px}.hero{font-size:36px;font-weight:950;font-style:italic;line-height:1.04;margin:10px 0}.muted,.note{color:var(--muted);line-height:1.5}.note{font-size:12px}.btn{background:var(--lime);color:#111;border:0;border-radius:10px;padding:11px 14px;font-weight:900;margin:4px;cursor:pointer}.alt{background:#292c32;color:#fff}.row,.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{width:50%}input,select{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #444;background:#141519;color:white;font:inherit}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}.item{padding:12px 0;border-bottom:1px solid var(--line)}.tag{color:var(--lime);font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#131419;border-radius:10px;padding:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.warn{color:#ffd27a}h2{font-size:19px;margin:2px 0 8px}li{line-height:1.6;color:var(--muted)}
</style></head><body><header>FORGED<b>FITNESS</b></header><main id="app"><section class="card">Opening app…</section></main><nav class="tabs" id="tabs"></nav><script>
(function(){var app=document.getElementById('app'),nav=document.getElementById('tabs'),key='ff-data-v1';var d={page:'Today',weight:130,foods:[],sessions:[],weights:[],goal:'',proteinGoal:'',macro:null};try{var old=JSON.parse(localStorage.getItem(key)||'{}');Object.keys(old).forEach(function(k){d[k]=old[k]})}catch(e){}d.foods=Array.isArray(d.foods)?d.foods:[];d.sessions=Array.isArray(d.sessions)?d.sessions:[];d.weights=Array.isArray(d.weights)?d.weights:[];
function day(){var x=new Date();return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)}function save(){try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function card(s){return '<section class="card">'+s+'</section>'}function go(p){d.page=p;save();render()}function addFood(n,c,p){d.foods.push({id:String(Date.now()),name:n,cal:+c||0,pro:+p||0,date:day()});save();render()}
var meals=[['Protein oats & banana',420,26],['Greek yoghurt & berries',250,20],['Eggs on wholemeal toast',380,24],['Tuna jacket potato',460,34]],recipes=[['Chicken rice bowl',560,43,'Chicken breast, rice, frozen vegetables. Cook rice; cook chicken through; heat veg and serve.'],['Bean chilli',430,22,'Mixed beans, chopped tomatoes, paprika. Simmer 15–20 minutes; serve with rice or potato.'],['Tuna jacket potato',490,36,'Potato, tuna, yoghurt. Cook potato until soft and add tuna mixture.'],['Tofu noodles',520,25,'Tofu, noodles, mixed vegetables. Cook noodles; brown tofu, heat vegetables, combine.']];
function streak(){var set={};d.sessions.forEach(function(s){set[s.date]=1});var t=new Date(),fmt=function(x){return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)};if(!set[fmt(t)])t.setDate(t.getDate()-1);var n=0;while(set[fmt(t)]){n++;t.setDate(t.getDate()-1)}return n}
function render(){var pages=['Today','Train','Food','Recipes','Macros','Rewards','Progress'];nav.innerHTML=pages.map(function(p){return '<button class="'+(d.page===p?'on':'')+'" data-page="'+p+'">'+p+'</button>'}).join('');var today=d.foods.filter(function(x){return x.date===day()}),cal=today.reduce(function(a,x){return a+x.cal},0),pro=today.reduce(function(a,x){return a+x.pro},0),h='';
if(d.page==='Today')h='<div class="eyebrow">YOUR FITNESS JOURNEY</div><div class="hero">BUILD YOURSELF.</div><p class="muted">Lose fat. Build strength. Keep showing up.</p>'+card('<div class="eyebrow">TODAY’S MISSION</div><h2>One day stronger.</h2><p class="muted">A little progress beats no progress.</p><button class="btn" data-page="Train">START WORKOUT</button>')+card('<div class="between"><div>FOOD TODAY<strong>'+cal+' kcal</strong></div><div>PROTEIN<strong>'+pro+' g</strong></div></div><button class="btn alt" data-page="Food">FOOD LOG</button>')+card('<span class="label">WORKOUT STREAK</span><div class="hero">🔥 '+streak()+' days</div><span class="muted">Log a workout to build consistency.</span>');
else if(d.page==='Train'){var split=[['Upper A','Chest press · Lat pulldown · Seated row · Shoulder press'],['Lower A','Leg press · Leg curl · Leg extension · Calf raise'],['Upper B','Chest-supported row · Incline press · Pulldown · Lateral raise'],['Lower B','Hip thrust · Leg curl · Split squat · Pallof press']];h='<div class="eyebrow">STRENGTH PLAN</div><div class="hero">THE WORK.</div><p class="muted">Use comfortable weights and controlled reps.</p>'+split.map(function(x){return card('<span class="tag">SESSION</span><h2>'+x[0]+'</h2><p class="muted">'+x[1]+'</p><button class="btn" data-finish="'+x[0]+'">FINISH WORKOUT</button>')}).join('')}
else if(d.page==='Food')h='<div class="eyebrow">FUEL THE WORK</div><div class="hero">FOOD LOG.</div>'+card('<h2>Meal shortcuts</h2><p class="note">Approximate per-serving nutrition.</p>'+meals.map(function(m,i){return '<div class="item"><div class="between"><span>'+m[0]+'<small class="muted">'+m[1]+' kcal · '+m[2]+' g protein</small></span><button class="btn" data-meal="'+i+'">ADD</button></div></div>'}).join(''))+card('<h2>Add a meal</h2><input id="fname" placeholder="Food name"><div class="row"><input id="fcal" type="number" placeholder="Calories"><input id="fpro" type="number" placeholder="Protein g"></div><button class="btn" data-add>ADD TO TODAY</button>')+card('<h2>Today</h2>'+(today.length?today.map(function(x){return '<div class="item">'+esc(x.name)+' · '+x.cal+' kcal · '+x.pro+' g protein</div>'}).join(''):'<p class="muted">Nothing logged yet.</p>')+'<strong>Total '+cal+' kcal · '+pro+' g protein</strong>');
else if(d.page==='Recipes')h='<div class="eyebrow">EASY MEAL IDEAS</div><div class="hero">RECIPES.</div><p class="note">Nutrition is an estimate; portions vary.</p>'+recipes.map(function(r,i){return card('<h2>'+r[0]+'</h2><p class="muted">~'+r[1]+' kcal · '+r[2]+' g protein</p><p class="muted">'+r[3]+'</p><button class="btn alt" data-recipe="'+i+'">ADD TO FOOD LOG</button>')}).join('');
else if(d.page==='Macros')h='<div class="eyebrow">FREE ON-DEVICE ESTIMATE</div><div class="hero">MACRO STARTER.</div><p class="note">Rough estimate, not AI or medical advice. For adults 18+.</p>'+card('<label>Age<input id="age" type="number" min="18" max="100" placeholder="Years"></label><label>Weight kg<input id="mw" type="number" value="'+esc(d.weight)+'"></label><label>Height cm<input id="mh" type="number" value="196"></label><label>Equation<select id="sex"><option value="range">Show range</option><option value="male">Male</option><option value="female">Female</option></select></label><label>Activity<select id="act"><option value="1.2">Mostly sitting</option><option value="1.375">Light activity</option><option value="1.55">Moderate activity</option></select></label><label>Goal<select id="def"><option value="0">Maintenance</option><option value="250">Gentle loss</option><option value="500">Moderate loss</option></select></label><button class="btn" data-macro>GENERATE</button>')+(d.macro?card('<h2>Daily rough targets</h2><div class="grid"><div class="stat">Calories<strong>'+d.macro.cal+' kcal</strong></div><div class="stat">Protein<strong>'+d.macro.pro+' g</strong></div><div class="stat">Carbs<strong>'+d.macro.carb+' g</strong></div><div class="stat">Fat<strong>'+d.macro.fat+' g</strong></div></div><p class="note">Estimate only. Personal needs vary; consider a GP or dietitian.</p>'): '');
else if(d.page==='Rewards'){var n=d.sessions.length,s=streak(),badges=[['🏁','First workout',n>=1],['🔥','3-day streak',s>=3],['💪','5 workouts',n>=5],['⚡','7-day streak',s>=7],['🏆','10 workouts',n>=10]];h='<div class="eyebrow">MILESTONES</div><div class="hero">STACK YOUR WINS.</div>'+card('<h2>🔥 '+s+' day streak</h2><p>'+n+' workouts logged</p>')+badges.map(function(b){return card((b[2]?b[0]:'🔒')+' '+b[1]+(b[2]?' · Unlocked':''))}).join('')}
else h='<div class="eyebrow">PROGRESS</div><div class="hero">CHECK IN.</div>'+card('<label>Weight (kg)<input id="weight" type="number" value="'+esc(d.weight)+'"></label><button class="btn" data-weight>SAVE WEIGHT</button>')+card('<h2>Weight history</h2>'+(d.weights.length?d.weights.slice().reverse().map(function(x){return '<div class="item">'+x.date+' — '+x.kg+' kg</div>'}).join(''):'No check-ins yet.'));
app.innerHTML=h}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.finish){d.sessions.push({name:b.dataset.finish,date:day()});save();render();return}if(b.dataset.meal!==undefined){var m=meals[+b.dataset.meal];addFood(m[0],m[1],m[2]);return}if(b.dataset.recipe!==undefined){var r=recipes[+b.dataset.recipe];addFood(r[0],r[1],r[2]);return}if(b.hasAttribute('data-add')){var n=document.getElementById('fname').value.trim(),c=Number(document.getElementById('fcal').value),p=Number(document.getElementById('fpro').value);if(!n){alert('Enter a food name.');return}addFood(n,c,p);return}if(b.hasAttribute('data-weight')){var w=Number(document.getElementById('weight').value);if(w<1||w>500){alert('Enter a valid weight.');return}d.weight=w;d.weights.push({date:day(),kg:w});save();render();return}if(b.hasAttribute('data-macro')){var age=Number(document.getElementById('age').value),w=Number(document.getElementById('mw').value),ht=Number(document.getElementById('mh').value),act=Number(document.getElementById('act').value),sex=document.getElementById('sex').value,def=Number(document.getElementById('def').value);if(age<18||age>100||w<35||ht<120){alert('Enter age 18+ and valid height and weight.');return}var base=10*w+6.25*ht-5*age,rest=sex==='male'?[base+5]:sex==='female'?[base-161]:[base-161,base+5],maint=rest.reduce(function(a,x){return a+x*act},0)/rest.length,cal=Math.round(Math.max(1200,maint-def)/50)*50,protein=Math.min(160,Math.round(w*1.6)),fat=Math.round(cal*.3/9),carb=Math.max(0,Math.round((cal-protein*4-fat*9)/4));d.macro={cal:cal,pro:protein,fat:fat,carb:carb};d.goal=cal;d.proteinGoal=protein;save();render()}});
try{render()}catch(error){app.innerHTML='<section class="card"><h2>App error</h2><p>'+String(error.message)+'</p></section>'}
})();
</script></body></html>
