<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>ForgeFit — Train with purpose</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--panel2:#24262c;--line:#34363d;--accent:#c5ff42;--text:#f6f7f3;--muted:#a1a4ad;--orange:#ff8747;--danger:#ff9e92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}header{height:60px;padding:0 20px;position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;background:#101114ed;border-bottom:1px solid var(--line)}.brand{font-weight:1000;font-style:italic;letter-spacing:1.5px;font-size:19px}.brand span,.eyebrow{color:var(--accent)}.small{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800}main{max-width:680px;margin:auto;padding:20px 17px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:2px}.hero{font-size:39px;line-height:1.02;font-weight:1000;font-style:italic;letter-spacing:-1.5px;margin:12px 0}.sub,.muted{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#202228,#191a1f);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero-card{background:linear-gradient(135deg,#c5ff42,#8cce1e);color:#14170e;border:0;padding:21px}.hero-card .eyebrow,.hero-card .muted{color:#2c3c16}.hero-card .hero{font-size:34px}.label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1.6px}.row,.between{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.row>*{flex:1}.metric{font-size:25px;font-weight:950}.big{font-size:34px;font-weight:950;letter-spacing:-1px}.btn{border:0;border-radius:11px;background:var(--accent);color:#15190e;padding:12px 15px;font:inherit;font-weight:950;cursor:pointer}.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.orange{background:var(--orange);color:#21140d}.btn.red{background:#402b28;color:var(--danger)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.track{height:8px;background:#3a3b40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;border-radius:20px;background:var(--accent)}input{width:100%;background:#131419;color:var(--text);border:1px solid #44464d;border-radius:10px;padding:12px;margin:6px 0;font:inherit}input::placeholder{color:#777a83}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;background:#191a1f;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:var(--muted);font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;min-width:55px;padding:5px}.tabs button.active{color:var(--accent)}.tabs span{display:block;font-size:19px;margin-bottom:3px}.pills{display:flex;gap:8px;overflow:auto;margin:15px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:850}.pill.sel{background:var(--accent);color:#15190e;border-color:var(--accent)}.exercise,.entry,.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child,.entry:last-child,.habit:last-child{border-bottom:0}.exercise small,.entry small{display:block;color:var(--muted);margin-top:4px}.exercise .btn{padding:9px 10px}.done{text-decoration:line-through;color:var(--muted)}.note{font-size:12px;line-height:1.55;color:var(--muted)}.quote{font-size:21px;font-weight:900;font-style:italic;line-height:1.4}.tag{display:inline-block;background:#303522;color:var(--accent);padding:6px 9px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:1px}.check{width:20px;height:20px;accent-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#141519;padding:13px;border-radius:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.empty{color:var(--muted);padding:10px 0}h2{font-size:19px;margin:2px 0 8px}p{line-height:1.55}.divider{height:1px;background:var(--line);margin:14px 0}.orange-text{color:var(--orange)}@media(min-width:650px){main{padding-top:28px}.hero{font-size:46px}}
</style>
</head>
<body>
<header><div class="brand">FORGE<span>FIT</span></div><div class="small">TRAIN WITH PURPOSE</div></header>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='forgefit-data-v2';
const dateKey=()=>{const x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const initial={tab:'Today',day:0,weight:130,foods:[],weights:[],sessions:[],checks:{},exerciseDone:{},calorieGoal:'',proteinGoal:''};
let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(s,cls=''){return `<section class="card ${cls}">${s}</section>`}
function button(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}
function field(k,ph,type='text'){return `<input type="${type}" min="0" value="${esc(data[k]??'')}" placeholder="${ph}" oninput="data.${k}=this.value;save()">`}
const plans=[['Upper A','CHEST · BACK · SHOULDERS',[['Machine chest press','3 × 8–12'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 10–12'],['Machine shoulder press','2 × 10–12'],['Cable triceps press-down','2 × 10–15'],['Dumbbell curl','2 × 10–15']]],['Lower A','QUADS · HAMSTRINGS · CORE',[['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–12'],['Leg extension','2 × 12–15'],['Calf raise','3 × 12–15'],['Dead bug','3 × 8 each side']]],['Upper B','BACK · CHEST · ARMS',[['Chest-supported row','3 × 8–12'],['Incline machine press','3 × 8–12'],['Neutral-grip pulldown','3 × 10–12'],['Cable lateral raise','3 × 12–15'],['Pec deck','2 × 12–15'],['Cable curl','2 × 10–15']]],['Lower B','GLUTES · HAMSTRINGS · CORE',[['Hip thrust machine','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Supported split squat','2 × 8–10 each'],['Pallof press','3 × 10 each side'],['Calf raise','3 × 12–15']]]];
const habits=['Get today’s movement in','Eat a protein-rich food','Have fruit or vegetables','Get ready for good sleep'];
const quotes=['Show up. Put in the work. Get a little stronger.','You do not need a perfect day. You need the next good choice.','Strength is built one rep—and one return to the gym—at a time.','The scale is one stat. Your effort is the real score.','Rest is training too. Recover, then come back ready.','Small wins stack up. Keep building.','You are stronger than the excuses you beat today.'];
function go(t){data.tab=t;save();render()}function todayFoods(){return data.foods.filter(f=>f.date===dateKey())}
function weeklyCount(){const from=new Date();from.setDate(from.getDate()-6);return data.sessions.filter(s=>new Date(s.date+'T12:00:00')>=from).length}
function renderTabs(){const items=[['Today','⌂'],['Train','✣'],['Food','＋'],['Progress','↗'],['Mindset','⚡']];$('#tabs').innerHTML=items.map(([n,i])=>`<button class="${data.tab===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}
function render(){const foods=todayFoods(),kcal=foods.reduce((n,f)=>n+f.cal,0),protein=foods.reduce((n,f)=>n+f.pro,0);let out='';
if(data.tab==='Today')out=`<div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}</div><div class="hero">BUILD<br>YOURSELF.</div><div class="sub">Lose fat. Build strength. Keep showing up.</div>${card(`<div class="between"><div><div class="eyebrow">TODAY’S MISSION</div><div class="hero" style="font-size:27px">One day stronger.</div><div class="muted">A little progress beats no progress.</div></div><span class="tag">LET’S GO</span></div><div style="margin-top:16px">${button('START A WORKOUT',"go('Train')",'orange')}</div>`,'hero-card')}${card(`<div class="between"><div><div class="label">WEEKLY TRAINING</div><div class="big">${weeklyCount()} <span class="muted" style="font-size:16px">sessions</span></div></div><span class="tag">LAST 7 DAYS</span></div><div class="track"><div class="fill" style="width:${Math.min(100,weeklyCount()/4*100)}%"></div></div><div class="note">A manageable starting goal is 2–4 strength sessions each week.</div>`)}${card(`<div class="between"><div><div class="label">FOOD LOG</div><div class="metric">${kcal} <span class="muted" style="font-size:14px">kcal</span></div></div><div style="text-align:right"><div class="label">PROTEIN</div><div class="metric">${protein} <span class="muted" style="font-size:14px">g</span></div></div></div><div class="divider"></div>${button('LOG FOOD',"go('Food')`,'alt')}`)}${card(`<div class="label">DAILY DISCIPLINE</div>${habits.map((h,i)=>`<label class="habit"><span>${h}</span><input class="check" type="checkbox" ${data.checks[dateKey()]?.[i]?'checked':''} onchange="toggleHabit(${i},this.checked)"></label>`).join('')}`)}<p class="note">You said you’re 6 ft 5 in and around 20–21 stone (about 127–133 kg). Update your actual weight in Progress. Targets are left blank rather than guessed.</p>`;
if(data.tab==='Train'){const p=plans[data.day],key=dateKey()+':'+data.day;out=`<div class="eyebrow">THE WORK</div><div class="hero">NO EXCUSES.<br>JUST REPS.</div><div class="sub">Four-day upper/lower plan · move with control · leave a few good reps in reserve.</div><div class="pills">${plans.map((x,i)=>`<button class="pill ${i===data.day?'sel':''}" onclick="data.day=${i};save();render()">${x[0]}</button>`).join('')}</div>${card(`<div class="label">TODAY’S SESSION</div><h2 style="font-size:24px;margin-top:7px">${p[0]}</h2><div class="tag">${p[1]}</div>${p[2].map(([n,r],i)=>`<div class="exercise"><div><strong class="${data.exerciseDone[key+':'+i]?'done':''}">${n}</strong><small>${r}</small></div><button class="btn alt" onclick="toggleExercise('${key}',${i})">${data.exerciseDone[key+':'+i]?'DONE ✓':'CHECK'}</button></div>`).join('')}<div style="margin-top:16px">${button('FINISH WORKOUT',`finishWorkout('${p[0]}')`)}</div>`)}<p class="note">Start with comfortable loads and good technique. Stop if you feel sharp or worsening pain. Ask a qualified trainer for help if you are unsure about form.</p>`}
if(data.tab==='Food')out=`<div class="eyebrow">FUEL THE WORK</div><div class="hero">EAT WELL.<br>GET STRONG.</div><div class="sub">Log food without judgement. Keep it simple and sustainable.</div>${card(`<h2>Optional daily goals</h2><p class="note">Calories and protein needs vary. These goals are optional and are not medical advice. Leave blank if you have not chosen a target with a qualified professional.</p><div class="row"><label>Calories (kcal)${field('calorieGoal','Leave blank','number')}</label><label>Protein (g)${field('proteinGoal','Leave blank','number')}</label></div>`)}${card(`<h2>Log a meal</h2><input id="foodName" placeholder="Food or meal name" maxlength="80"><div class="row"><input id="foodCal" type="number" min="0" placeholder="Calories"><input id="foodPro" type="number" min="0" placeholder="Protein (g)"></div>${button('ADD TO TODAY','addFood()')}`)}${card(`<div class="between"><h2>Today’s log</h2><span class="tag">${foods.length} ITEMS</span></div>${foods.length?foods.map(f=>`<div class="entry"><span><strong>${esc(f.name)}</strong><small>${f.cal} kcal · ${f.pro} g protein</small></span><button class="btn red" onclick="removeFood('${f.id}')">REMOVE</button></div>`).join(''):'<div class="empty">Nothing logged yet. Add a meal above.</div>'}<div class="divider"></div><strong>TOTAL: ${kcal} kcal · ${protein} g protein</strong>`)}${card('<h2>Go-to staples</h2><p class="muted">Eggs · beans · yoghurt · chicken · tofu · oats · potatoes · rice · frozen vegetables · fruit. Pick what you like and can afford.</p>')}`;
if(data.tab==='Progress')out=`<div class="eyebrow">PROOF OF YOUR WORK</div><div class="hero">TRACK THE<br>COMEBACK.</div><div class="sub">The goal is progress—not perfection. Strength, energy and habits count too.</div>${card(`<h2>Weight check-in</h2><p class="muted">Record your weight in kilograms.</p><div class="row">${field('weight','Weight in kg','number')}<button class="btn" onclick="saveWeight()">SAVE</button></div><div class="grid"><div class="stat"><div class="label">LATEST</div><strong>${esc(data.weight)} kg</strong></div><div class="stat"><div class="label">CHECK-INS</div><strong>${data.weights.length}</strong></div></div><p class="note">For a useful trend, weigh under similar conditions and focus on changes over time rather than day-to-day movement.</p>`)}${card(`<h2>Weight history</h2>${data.weights.length?data.weights.slice().reverse().slice(0,12).map(w=>`<div class="entry"><span>${new Date(w.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span><strong>${w.kg} kg</strong></div>`).join(''):'<div class="empty">Your check-ins will appear here.</div>'}`)}${card(`<div class="label">WEEKLY TRAINING</div><div class="big">${weeklyCount()} <span class="muted" style="font-size:16px">sessions this week</span></div><p class="note">2–4 sessions can be a reasonable place to start. Adjust for your fitness and recovery.</p>`)}<p class="note">For personal health or nutrition advice—especially if you have pain, a health condition, or take medication—ask your GP or a registered dietitian.</p>`;
if(data.tab==='Mindset'){const q=quotes[Math.floor(Date.now()/86400000)%quotes.length];out=`<div class="eyebrow">MENTAL GAME</div><div class="hero">STAY IN<br>THE FIGHT.</div>${card(`<div class="label">TODAY’S REMINDER</div><p class="quote">“${q}”</p><p class="muted">You’re building a stronger body and better habits. It takes time—and you’re allowed to start small.</p>`)}${card(`<h2>Keep perspective</h2><div class="habit">✦ <span>A short workout still counts.</span></div><div class="habit">✦ <span>One missed day does not undo your effort.</span></div><div class="habit">✦ <span>Track strength and consistency, not only the scale.</span></div><div class="habit">✦ <span>Recovery is part of the plan.</span></div>`)}${card(`<h2>Recent sessions</h2>${data.sessions.length?data.sessions.slice(-5).reverse().map(s=>`<div class="entry"><strong>${esc(s.name)}</strong><small>${new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div>`).join(''):'<div class="empty">Your first session is waiting in Train. Start when you’re ready.</div>'}`)}<p class="note">ForgeFit is a simple personal tracker, not a medical service or AI coach. Your data stays in this browser on this device.</p>`}
$('#app').innerHTML=out;renderTabs()}
function toggleHabit(i,v){data.checks[dateKey()]={...(data.checks[dateKey()]||{}),[i]:v};save()}
function toggleExercise(key,i){data.exerciseDone[key+':'+i]=!data.exerciseDone[key+':'+i];save();render()}
function finishWorkout(name){data.sessions.push({name,date:dateKey()});save();render();alert('Workout saved. You showed up—that’s a win.')}
function addFood(){const name=$('#foodName').value.trim(),cal=Number($('#foodCal').value),pro=Number($('#foodPro').value);if(!name||!Number.isFinite(cal)||!Number.isFinite(pro)||cal<0||pro<0){alert('Enter a food name and valid calorie and protein numbers.');return}data.foods.push({id:String(Date.now()),name,cal,pro,date:dateKey()});save();render()}
function removeFood(id){data.foods=data.foods.filter(f=>f.id!==id);save();render()}
function saveWeight(){const kg=Number(data.weight);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}data.weight=Math.round(kg*10)/10;data.weights.push({kg:data.weight,date:dateKey()});save();render()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script>
</body>
</html>
